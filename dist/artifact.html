<style>
/* css/core.css */
/* The Long Table — core styles.
   Layout: a candlelit Dutch still life you can walk into. Full-bleed scenes on an umber ground,
   lit by the candle you carry. One deliberate night-time look (single theme). */
:root {
  --ground: #15110c;
  --ground-2: #201a12;
  --ground-3: #2c2419;
  --linen: #efe6d2;
  --linen-2: #cfc3a9;
  --linen-3: #9d927c;
  --pewter: #8e9089;
  --lemon: #f2c14e;
  --flame: #ffb24a;
  --ember: #e0662f;
  --wine: #6f1526;
  --cran: #b8243d;
  --olive: #646a3a;
  --sage: #8b9467;
  --paper: #e8dcc1;
  --paper-2: #d8c7a3;
  --ink: #24170e;
  --ink-2: #5b4632;
  --shadow: rgba(6, 4, 2, 0.6);

  --f-display: "IM Fell Double Pica", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-sc: "IM Fell English SC", "IM Fell Double Pica", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-script: "Homemade Apple", "Brush Script MT", "Segoe Script", cursive;

  --step--2: clamp(0.72rem, 0.7rem + 0.1vw, 0.8rem);
  --step--1: clamp(0.84rem, 0.8rem + 0.2vw, 0.94rem);
  --step-0: clamp(1rem, 0.95rem + 0.25vw, 1.14rem);
  --step-1: clamp(1.2rem, 1.08rem + 0.6vw, 1.5rem);
  --step-2: clamp(1.55rem, 1.3rem + 1.3vw, 2.3rem);
  --step-3: clamp(2.1rem, 1.6rem + 2.6vw, 3.7rem);
  --step-4: clamp(2.8rem, 1.9rem + 4.6vw, 6.2rem);
  --step-5: clamp(3.4rem, 1.8rem + 8.6vw, 9.6rem);

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --paper-tex: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.55'/></svg>");
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--linen);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
::selection { background: var(--lemon); color: var(--ink); }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--ground); }
#stage { position: absolute; inset: 0; z-index: 1; will-change: transform; }
.chapter { position: absolute; inset: 0; overflow: hidden; }
.chapter.scrolls { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--ground-3) transparent; }

/* the candle you carry */
#vignette { position: fixed; inset: 0; z-index: 19; pointer-events: none;
  background: radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(6, 4, 2, 0.55) 100%); }
#dark { position: fixed; inset: 0; z-index: 20; pointer-events: none; transition: opacity 0.6s;
  --lx: 50vw; --ly: 45vh; --lr: 300px; --ld: 0.9;
  background: radial-gradient(circle var(--lr) at var(--lx) var(--ly), rgba(9, 7, 4, 0) 0%, rgba(9, 7, 4, calc(var(--ld) * 0.35)) 45%, rgba(9, 7, 4, calc(var(--ld) * 0.8)) 78%, rgba(9, 7, 4, var(--ld)) 100%); }
#glow { position: fixed; inset: 0; z-index: 21; pointer-events: none; mix-blend-mode: screen;
  --lx: 50vw; --ly: 45vh; --lr: 300px;
  background: radial-gradient(circle var(--lr) at var(--lx) var(--ly), rgba(255, 170, 80, 0.16) 0%, rgba(255, 140, 50, 0.06) 45%, rgba(255, 120, 40, 0) 75%); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
#glass { position: fixed; inset: 0; z-index: 35; pointer-events: none; overflow: hidden; }
.fx-splat { position: absolute; overflow: visible; transition: opacity 1.1s ease, transform 1.1s ease; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); }
.fx-splat--gone { opacity: 0; transform: translateY(30px); }
.fx-drip { transform-origin: 50% 0; animation: fx-drip 3s var(--ease-out) both; }
@keyframes fx-drip { from { transform: scaleY(0.05); } to { transform: scaleY(1); } }
.fx-flash { position: fixed; inset: 0; z-index: 95; pointer-events: none; }
#grain { position: fixed; inset: -100%; z-index: 100; pointer-events: none; opacity: 0.075;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23g)'/></svg>");
  animation: grain 0.9s steps(5) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); } 60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); } }

/* chrome */
#chrome { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, rgba(21, 17, 12, 0.88), rgba(21, 17, 12, 0)); pointer-events: none;
  transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); }
#chrome[data-hidden] { opacity: 0; transform: translateY(-12px); }
#chrome[data-hidden] * { pointer-events: none !important; }
#chrome > * { pointer-events: auto; }
.chrome-mark { justify-self: start; background: none; border: 0; padding: 6px 0; cursor: pointer; font-family: var(--f-display); font-size: var(--step-0); color: var(--linen-2); letter-spacing: 0.01em; white-space: nowrap; }
.chrome-mark:hover { color: var(--lemon); }
.chrome-course { justify-self: center; font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.14em; color: var(--linen-3); white-space: nowrap; text-align: center; }
.chrome-course b { color: var(--lemon); font-weight: 400; }
.chrome-right { justify-self: end; display: flex; gap: 6px; align-items: center; }
.chrome-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(21, 17, 12, 0.5); border: 1px solid rgba(239, 230, 210, 0.18); color: var(--linen-2); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-family: var(--f-ui); font-size: var(--step--1); letter-spacing: 0.04em; transition: border-color 0.2s, color 0.2s, background 0.2s; }
.chrome-btn:hover { border-color: var(--lemon); color: var(--lemon); }
.chrome-btn svg { width: 16px; height: 16px; }
@media (max-width: 640px) {
  #chrome { grid-template-columns: 1fr auto; }
  .chrome-course { display: none; }
  .chrome-mark { font-size: var(--step--1); }
  .chrome-btn .lbl { display: none; }
  .chrome-btn { padding: 8px 10px; }
}

/* focus, always visible */
:focus-visible { outline: 2px solid var(--lemon); outline-offset: 3px; border-radius: 3px; }

/* toasts */
#toasts { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 420px); }
.lt-toast { pointer-events: auto; background: var(--paper) var(--paper-tex); color: var(--ink); padding: 10px 16px 11px; border-radius: 2px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); font-family: var(--f-body); font-size: var(--step--1); line-height: 1.35; display: flex; gap: 12px; align-items: center; transform-origin: 50% 100%; animation: toast-in 0.6s var(--ease-back) both; max-width: 100%; }
.lt-toast b { font-family: var(--f-sc); font-weight: 400; letter-spacing: 0.08em; color: var(--wine); display: block; font-size: var(--step--2); }
.lt-toast .seal { flex: none; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c93a4c, #7d1a2c 60%, #4d0f19); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.3); display: grid; place-items: center; color: #f3d6b8; font-family: var(--f-display); font-size: 17px; }
.lt-toast.out { animation: toast-out 0.4s var(--ease-in-out) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(24px) rotate(-2deg) scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(16px) scale(0.96); } }

/* veil (transitions) */
#veil { position: fixed; inset: 0; z-index: 90; pointer-events: none; visibility: hidden; }
#veil.on { visibility: visible; pointer-events: auto; }
.veil-candle { position: absolute; inset: 0; background: var(--ground); --vr: 200vmax; --vx: 50%; --vy: 50%;
  -webkit-mask-image: radial-gradient(circle var(--vr) at var(--vx) var(--vy), transparent 0, transparent calc(var(--vr) * 0.82), #000 var(--vr));
  mask-image: radial-gradient(circle var(--vr) at var(--vx) var(--vy), transparent 0, transparent calc(var(--vr) * 0.82), #000 var(--vr)); }
.veil-cloth { position: absolute; inset: -4% -8%; transform: translateX(-110%) skewX(-6deg);
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0) 8%, rgba(0, 0, 0, 0) 92%, rgba(0, 0, 0, 0.35)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 34px, rgba(255, 245, 230, 0.06) 34px 36px, rgba(255, 255, 255, 0) 36px 120px),
    repeating-linear-gradient(0deg, rgba(111, 21, 38, 0.55) 0 46px, rgba(0, 0, 0, 0) 46px 92px),
    repeating-linear-gradient(90deg, rgba(111, 21, 38, 0.55) 0 46px, rgba(0, 0, 0, 0) 46px 92px),
    #d8ccb0;
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.6); }
.veil-smoke { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, #3a3127, var(--ground) 75%); opacity: 0; }
.veil-card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px var(--gutter); opacity: 0; color: var(--linen); }
.veil-card .k { font-family: var(--f-sc); letter-spacing: 0.22em; color: var(--lemon); font-size: var(--step--1); }
.veil-card .t { font-family: var(--f-display); font-size: var(--step-4); line-height: 1; letter-spacing: -0.01em; }
.veil-card .t i { color: var(--lemon); font-style: italic; }
.veil-card .b { font-family: var(--f-body); font-style: italic; color: var(--linen-2); font-size: var(--step-1); max-width: 30ch; margin: 6px auto 0; text-wrap: balance; }
.veil-cloth + .veil-card, .veil-cloth ~ .veil-card { color: var(--ink); }
.veil-cloth ~ .veil-card .k { color: var(--wine); }
.veil-cloth ~ .veil-card .t i { color: var(--wine); }
.veil-cloth ~ .veil-card .b { color: var(--ink-2); }

/* shared components */
.lt-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 70px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.lt-eyebrow { font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.18em; color: var(--lemon); text-transform: none; }
.lt-display { font-family: var(--f-display); font-weight: 400; line-height: 1.02; letter-spacing: -0.012em; text-wrap: balance; margin: 0; }
.lt-display i, .lt-display em { font-style: italic; color: var(--lemon); }
.lt-prose { max-width: 62ch; font-size: var(--step-0); line-height: 1.62; color: var(--linen-2); text-wrap: pretty; }
.lt-prose p { margin: 0 0 1em; }
.lt-prose strong { color: var(--linen); font-weight: 600; }
.lt-hand { font-family: var(--f-hand); font-weight: 600; }
.lt-script { font-family: var(--f-script); }
.lt-cite { font-family: var(--f-ui); font-size: var(--step--2); color: var(--linen-3); letter-spacing: 0.02em; }
.lt-card { background: var(--paper) var(--paper-tex); color: var(--ink); border-radius: 2px; box-shadow: 0 2px 0 rgba(255, 255, 255, 0.25) inset, 0 30px 70px rgba(0, 0, 0, 0.55), 0 6px 14px rgba(0, 0, 0, 0.4); }

.lt-btn { -webkit-appearance: none; appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.6em; cursor: pointer; font-family: var(--f-sc); font-size: var(--step-0); letter-spacing: 0.08em; color: var(--lemon); background: rgba(242, 193, 78, 0.07); border: 1px solid rgba(242, 193, 78, 0.55); padding: 0.72em 1.4em 0.78em; border-radius: 2px; transition: background 0.25s, box-shadow 0.25s, transform 0.25s var(--ease-out), color 0.25s; text-decoration: none; line-height: 1.1; }
.lt-btn:hover { background: rgba(242, 193, 78, 0.16); box-shadow: 0 0 34px rgba(242, 193, 78, 0.22); transform: translateY(-1px); }
.lt-btn:active { transform: translateY(1px) scale(0.99); }
.lt-btn--ghost { color: var(--linen-2); border-color: rgba(239, 230, 210, 0.25); background: transparent; }
.lt-btn--ghost:hover { color: var(--linen); background: rgba(239, 230, 210, 0.06); box-shadow: none; }
.lt-btn--ink { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.lt-btn--ink:hover { background: var(--wine); border-color: var(--wine); box-shadow: 0 8px 24px rgba(111, 21, 38, 0.3); }
.lt-btn[disabled] { opacity: 0.4; pointer-events: none; }

.lt-next { -webkit-appearance: none; appearance: none; cursor: pointer; display: inline-grid; grid-template-columns: auto auto; align-items: center; column-gap: 18px; text-align: left; background: transparent; border: 0; border-top: 1px solid rgba(242, 193, 78, 0.45); border-bottom: 1px solid rgba(242, 193, 78, 0.45); padding: 14px 6px 16px; color: var(--linen); transition: color 0.3s, letter-spacing 0.4s var(--ease-out); }
.lt-next .k { grid-column: 1; font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.2em; color: var(--lemon); }
.lt-next .t { grid-column: 1; font-family: var(--f-display); font-size: var(--step-2); line-height: 1.05; }
.lt-next .t i { color: var(--lemon); }
.lt-next .a { grid-column: 2; grid-row: 1 / span 2; font-family: var(--f-display); font-size: var(--step-3); color: var(--lemon); transition: transform 0.4s var(--ease-out); }
.lt-next:hover .a { transform: translateX(8px); }
.lt-next:hover .t { color: var(--lemon); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- prelude ---------- */
.prelude { display: grid; place-items: center; }
.prelude .stage { position: relative; width: min(100%, 760px); height: 100%; display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: end; padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 22px); box-sizing: border-box; }
.prelude canvas.candle { width: min(180px, 34vw); height: min(46vh, 420px); display: block; grid-row: 1; align-self: end; }
.prelude .title { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 7vh); text-align: center; padding: 0 var(--gutter); pointer-events: none; }
.prelude .title h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-5); line-height: 0.92; margin: 0; letter-spacing: -0.02em; color: var(--linen); text-shadow: 0 0 40px rgba(255, 170, 80, 0.35); }
.prelude .title h1 .l { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(14px); transition: opacity 1.3s var(--ease-out), filter 1.6s var(--ease-out), transform 1.6s var(--ease-out); }
.prelude .title h1 .l.on { opacity: 1; filter: blur(0); transform: none; }
.prelude .title h1 .the { display: block; font-style: italic; font-size: 0.36em; color: var(--lemon); letter-spacing: 0; margin-bottom: 0.08em; }
.prelude .title .sub { margin-top: 1.1rem; font-family: var(--f-display); font-style: italic; font-size: var(--step-1); color: var(--linen-2); opacity: 0; transition: opacity 1.5s 0.4s; }
.prelude .title .date { margin-top: 0.8rem; font-family: var(--f-sc); letter-spacing: 0.16em; color: var(--linen-3); font-size: var(--step--1); opacity: 0; transition: opacity 1.5s 0.9s; min-height: 1.4em; text-wrap: balance; }
.prelude .title.on .sub, .prelude .title.on .date { opacity: 1; }
.prelude .below { grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 18px; min-height: 120px; }
.prelude .hint { font-family: var(--f-display); font-style: italic; color: var(--linen-3); font-size: var(--step-1); text-align: center; transition: opacity 0.6s; }
.prelude .hint small { display: block; font-style: normal; font-family: var(--f-ui); font-size: var(--step--2); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; opacity: 0.7; }
.matchbox { position: relative; cursor: pointer; background: none; border: 0; padding: 0; width: 200px; height: 96px; touch-action: none; }
.matchbox svg { width: 100%; height: 100%; overflow: visible; }
.matchbox:hover .mb-drawer { transform: translateX(10px); }
.mb-drawer { transition: transform 0.4s var(--ease-out); }
.match { position: fixed; z-index: 40; width: 74px; height: 12px; pointer-events: none; transform-origin: 8px 50%; }
.prelude .enter { opacity: 0; transform: translateY(10px); transition: opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out); pointer-events: none; }
.prelude .enter.on { opacity: 1; transform: none; pointer-events: auto; }
.prelude .skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-family: var(--f-ui); font-size: var(--step--2); color: var(--linen-3); background: none; border: 0; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
.prelude .skip:hover { opacity: 1; color: var(--linen); }

/* ---------- bill of fare ---------- */
.menu-page { display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 74px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 48px); box-sizing: border-box; min-height: 100%; }
.bill { position: relative; width: min(100%, 560px); padding: clamp(28px, 6vw, 56px) clamp(20px, 6vw, 58px) clamp(30px, 5vw, 48px); box-sizing: border-box; text-align: center; transform-origin: 50% 0; animation: bill-in 1.4s var(--ease-out) both; }
@keyframes bill-in { from { opacity: 0; transform: translateY(30px) rotate(-1.5deg); } to { opacity: 1; transform: rotate(-0.4deg); } }
.bill::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(36, 23, 14, 0.35); pointer-events: none; }
.bill::after { content: ""; position: absolute; inset: 14px; border: 3px double rgba(36, 23, 14, 0.25); pointer-events: none; }
.bill .fleuron { font-family: var(--f-display); font-size: 30px; color: var(--wine); line-height: 1; }
.bill .house { font-family: var(--f-sc); letter-spacing: 0.3em; font-size: var(--step--1); color: var(--ink-2); margin-top: 8px; }
.bill h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); margin: 4px 0 0; line-height: 1; color: var(--ink); }
.bill h2 i { color: var(--wine); }
.bill .when { font-family: var(--f-display); font-style: italic; color: var(--ink-2); margin-top: 8px; font-size: var(--step-0); }
.bill .rule { display: flex; align-items: center; gap: 12px; margin: 22px auto 10px; color: var(--wine); width: 80%; }
.bill .rule::before, .bill .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: 0.5; }
.bill ol { list-style: none; margin: 0; padding: 0; }
.bill li { margin: 0; }
.course-btn { position: relative; display: block; width: 100%; background: none; border: 0; padding: 12px 8px 14px; cursor: pointer; color: var(--ink); text-align: center; border-radius: 2px; transition: background 0.3s; }

        const r = box.getBoundingClientRect();
        if (!LT.pointer.active) LT.light.moveTo(r.left + r.width / 2, r.top + r.height / 2, true);
      }, 60);

      let struck = false;
      async function strike(fast) {
        if (struck) return;
        struck = true;
        LT.audio.init();
        skip.remove();
        const r = box.getBoundingClientRect();
        const m = el('div', { class: 'match', html: MATCH });
        document.body.appendChild(m);
        api.cleanup(() => m.remove());
        const sx = r.left + r.width * 0.12, sy = r.top + r.height * 0.1;
        const place = (x, y, rot = -8) => { m.style.left = x - 6 + 'px'; m.style.top = y - 6 + 'px'; m.style.transform = `rotate(${rot}deg)`; };
        place(sx, sy);
        LT.light.follow(false);
        if (!fast) {
          await U.tween({ from: 0, to: 1, dur: 0.2, ease: 'inQuad', onUpdate: (k) => { place(sx + k * r.width * 0.75, sy + Math.sin(k * 3) * 2); } }).done;
        }
        if (!api.alive) return;
        LT.audio.sfx('match');
        const hx = sx + (fast ? 0 : r.width * 0.75), hy = sy;
        LT.fx.sparks(hx, hy, 34);
        LT.fx.glow(hx, hy, { size: 50, life: 0.5 });
        const head = m.querySelector('.mh');
        head && head.setAttribute('fill', '#3a1a10');
        const flame = el('div', { style: { position: 'absolute', left: '-9px', top: '-26px', width: '24px', height: '34px', borderRadius: '50% 50% 45% 45% / 65% 65% 35% 35%', background: 'radial-gradient(ellipse at 50% 75%, #fff4cc 0%, #ffcf6b 30%, #ff8a2a 60%, rgba(255,120,40,0) 75%)', filter: 'blur(.6px)', mixBlendMode: 'screen', animation: 'match-flicker .12s infinite alternate' } });
        m.appendChild(flame);
        LT.light.set({ darkness: 0.93, radius: 190 });
        LT.light.moveTo(hx, hy, true);
        hint.style.opacity = 0; box.style.transition = 'opacity .8s'; box.style.opacity = 0;
        await api.wait(fast ? 100 : 650);
        const fp = candle.flamePos();
        const tx = fp.x - 2, ty = fp.y + 22 * fp.s;
        await U.tween({ from: [hx, hy, -8], to: [tx, ty, -58], dur: fast ? 0.3 : 1.15, ease: 'inOutCubic', onUpdate: ([x, y, rot]) => { place(x, y, rot); LT.light.moveTo(x, y + 4, true); } }).done;
        if (!api.alive) return;
        await api.wait(fast ? 50 : 380);
        candle.light();
        LT.audio.sfx('whoomp');
        LT.fx.sparks(tx, ty - 10, 18, { speed: [60, 240] });
        LT.light.pulse();
        LT.light.set({ darkness: 0.9, radius: 330 });
        LT.light.moveTo(tx, ty - 30);
        LT.music.play('prelude', 4);
        // shake the match out
        await api.wait(500);
        flame.remove();
        LT.audio.sfx('snuff');
        LT.fx.smoke(tx + 30, ty, { count: 8 });
        m.animate([{ transform: 'rotate(-58deg)', opacity: 1 }, { transform: 'translate(40px, 160px) rotate(40deg)', opacity: 0 }], { duration: 1100, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'forwards' });
        // the title
        await api.wait(300);
        LT.light.set({ darkness: 0.86, radius: 520 });
        h1.querySelector('.the').classList.add('on');
        for (let i = 0; i < letters.length; i++) { await api.wait(85); letters[i].classList.add('on'); }
        title.classList.add('on');
        await api.wait(1400);
        LT.light.follow(true);
        below.innerHTML = '';
        below.append(enter, extra);
        requestAnimationFrame(() => { enter.classList.add('on'); extra.style.opacity = 1; });
        enter.focus({ preventScroll: true });
        LT.fx.embers(1.5);
      }
      api.on(box, 'click', () => strike(false));
      api.on(skip, 'click', () => { LT.audio.init(); candle.light(); LT.music.play('prelude', 1); LT.app.afterPrelude(); });
      api.on(enter, 'click', () => { LT.audio.sfx('clink'); LT.app.afterPrelude(); });
      // Any key strikes too (once you've found the box, the dark is optional).
      api.on(window, 'keydown', (e) => { if (!struck && (e.key === 'Enter' || e.key === ' ') && document.activeElement !== box) { e.preventDefault(); strike(false); } });
    },
  });
})();
