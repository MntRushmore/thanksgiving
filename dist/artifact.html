<title>The Long Table</title>
<meta name="description" content="An interactive Thanksgiving in five courses: the history, the food, the chaos of the family table, and what gratitude actually is.">

<style>
/* css/core.css */
/* The Long Table — core styles.
   Layout: a candlelit Dutch still life you can walk into. Full-bleed scenes on an umber ground,
   lit by the candle you carry. One deliberate night-time look (single theme). */
:root {
  --ground: #15110c;
  --ground-2: #201a12;
  --ground-3: #2c2419;
  --linen: #efe6d2;
  --linen-2: #cfc3a9;
  --linen-3: #9d927c;
  --pewter: #8e9089;
  --lemon: #f2c14e;
  --flame: #ffb24a;
  --ember: #e0662f;
  --wine: #6f1526;
  --cran: #b8243d;
  --olive: #646a3a;
  --sage: #8b9467;
  --paper: #e8dcc1;
  --paper-2: #d8c7a3;
  --ink: #24170e;
  --ink-2: #5b4632;
  --shadow: rgba(6, 4, 2, 0.6);

  --f-display: "IM Fell Double Pica", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-sc: "IM Fell English SC", "IM Fell Double Pica", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --f-script: "Homemade Apple", "Brush Script MT", "Segoe Script", cursive;

  --step--2: clamp(0.72rem, 0.7rem + 0.1vw, 0.8rem);
  --step--1: clamp(0.84rem, 0.8rem + 0.2vw, 0.94rem);
  --step-0: clamp(1rem, 0.95rem + 0.25vw, 1.14rem);
  --step-1: clamp(1.2rem, 1.08rem + 0.6vw, 1.5rem);
  --step-2: clamp(1.55rem, 1.3rem + 1.3vw, 2.3rem);
  --step-3: clamp(2.1rem, 1.6rem + 2.6vw, 3.7rem);
  --step-4: clamp(2.8rem, 1.9rem + 4.6vw, 6.2rem);
  --step-5: clamp(3.4rem, 1.8rem + 8.6vw, 9.6rem);

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --paper-tex: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.55'/></svg>");
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--linen);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
::selection { background: var(--lemon); color: var(--ink); }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--ground); }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; opacity: 0; pointer-events: none; }
#stage { position: absolute; inset: 0; z-index: 1; will-change: transform; }
.chapter { position: absolute; inset: 0; overflow: hidden; }
.chapter.scrolls { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--ground-3) transparent; }

/* the candle you carry */
#vignette { position: fixed; inset: 0; z-index: 19; pointer-events: none;
  background: radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(6, 4, 2, 0.55) 100%); }
#dark { position: fixed; inset: 0; z-index: 20; pointer-events: none; transition: opacity 0.6s;
  --lx: 50vw; --ly: 45vh; --lr: 300px; --ld: 0.9;
  background: radial-gradient(circle var(--lr) at var(--lx) var(--ly), rgba(9, 7, 4, 0) 0%, rgba(9, 7, 4, calc(var(--ld) * 0.35)) 45%, rgba(9, 7, 4, calc(var(--ld) * 0.8)) 78%, rgba(9, 7, 4, var(--ld)) 100%); }
#glow { position: fixed; inset: 0; z-index: 21; pointer-events: none;
  --lx: 50vw; --ly: 45vh; --lr: 300px;
  background: radial-gradient(circle var(--lr) at var(--lx) var(--ly), rgba(255, 176, 90, 0.1) 0%, rgba(255, 150, 60, 0.04) 45%, rgba(255, 120, 40, 0) 75%); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
#glass { position: fixed; inset: 0; z-index: 35; pointer-events: none; overflow: hidden; }
.fx-splat { position: absolute; overflow: visible; transition: opacity 1.1s ease, transform 1.1s ease; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); }
.fx-splat--gone { opacity: 0; transform: translateY(30px); }
.fx-drip { transform-origin: 50% 0; animation: fx-drip 3s var(--ease-out) both; }
@keyframes fx-drip { from { transform: scaleY(0.05); } to { transform: scaleY(1); } }
.fx-flash { position: fixed; inset: 0; z-index: 95; pointer-events: none; }
#grain { position: fixed; inset: -12%; z-index: 100; pointer-events: none; opacity: 0.075;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23g)'/></svg>");
  animation: grain 0.9s steps(5) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); } 40% { transform: translate(2%, -3%); } 60% { transform: translate(-2%, -1%); } 80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); } }

/* chrome */
#chrome { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, rgba(21, 17, 12, 0.88), rgba(21, 17, 12, 0)); pointer-events: none;
  transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out); }
#chrome[data-hidden] { opacity: 0; transform: translateY(-12px); }
#chrome[data-hidden] * { pointer-events: none !important; }
#chrome > * { pointer-events: auto; }
.chrome-mark { justify-self: start; background: none; border: 0; padding: 6px 0; cursor: pointer; font-family: var(--f-display); font-size: var(--step-0); color: var(--linen-2); letter-spacing: 0.01em; white-space: nowrap; }
.chrome-mark:hover { color: var(--lemon); }
.chrome-course { justify-self: center; font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.14em; color: var(--linen-3); white-space: nowrap; text-align: center; }
.chrome-course b { color: var(--lemon); font-weight: 400; }
.chrome-right { justify-self: end; display: flex; gap: 6px; align-items: center; }
.chrome-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(21, 17, 12, 0.5); border: 1px solid rgba(239, 230, 210, 0.18); color: var(--linen-2); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-family: var(--f-ui); font-size: var(--step--1); letter-spacing: 0.04em; transition: border-color 0.2s, color 0.2s, background 0.2s; }
.chrome-btn:hover { border-color: var(--lemon); color: var(--lemon); }
.chrome-btn svg { width: 16px; height: 16px; }
@media (max-width: 640px) {
  #chrome { grid-template-columns: 1fr auto; }
  .chrome-course { display: none; }
  .chrome-mark { font-size: var(--step--1); }
  .chrome-btn .lbl { display: none; }
  .chrome-btn { padding: 8px 10px; }
}

/* focus, always visible */
:focus-visible { outline: 2px solid var(--lemon); outline-offset: 3px; border-radius: 3px; }

/* toasts */
#toasts { position: fixed; z-index: 60; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 420px); }
.lt-toast { pointer-events: auto; background: var(--paper) var(--paper-tex); color: var(--ink); padding: 10px 16px 11px; border-radius: 2px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); font-family: var(--f-body); font-size: var(--step--1); line-height: 1.35; display: flex; gap: 12px; align-items: center; transform-origin: 50% 100%; animation: toast-in 0.6s var(--ease-back) both; max-width: 100%; }
.lt-toast b { font-family: var(--f-sc); font-weight: 400; letter-spacing: 0.08em; color: var(--wine); display: block; font-size: var(--step--2); }
.lt-toast .seal { flex: none; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c93a4c, #7d1a2c 60%, #4d0f19); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.3); display: grid; place-items: center; color: #f3d6b8; font-family: var(--f-display); font-size: 17px; }
.lt-toast.out { animation: toast-out 0.4s var(--ease-in-out) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(24px) rotate(-2deg) scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(16px) scale(0.96); } }

/* veil (transitions) */
#veil { position: fixed; inset: 0; z-index: 90; pointer-events: none; visibility: hidden; }
#veil.on { visibility: visible; pointer-events: auto; }
.veil-candle { position: absolute; inset: 0; background: var(--ground); --vr: 200vmax; --vx: 50%; --vy: 50%;
  -webkit-mask-image: radial-gradient(circle var(--vr) at var(--vx) var(--vy), transparent 0, transparent calc(var(--vr) * 0.82), #000 var(--vr));
  mask-image: radial-gradient(circle var(--vr) at var(--vx) var(--vy), transparent 0, transparent calc(var(--vr) * 0.82), #000 var(--vr)); }
.veil-cloth { position: absolute; inset: -4% -8%; transform: translateX(-110%) skewX(-6deg);
  background:
    linear-gradient(90deg, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0) 8%, rgba(0, 0, 0, 0) 92%, rgba(0, 0, 0, 0.35)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 34px, rgba(255, 245, 230, 0.06) 34px 36px, rgba(255, 255, 255, 0) 36px 120px),
    repeating-linear-gradient(0deg, rgba(111, 21, 38, 0.55) 0 46px, rgba(0, 0, 0, 0) 46px 92px),
    repeating-linear-gradient(90deg, rgba(111, 21, 38, 0.55) 0 46px, rgba(0, 0, 0, 0) 46px 92px),
    #d8ccb0;
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.6); }
.veil-smoke { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, #3a3127, var(--ground) 75%); opacity: 0; }
.veil-card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px var(--gutter); opacity: 0; color: var(--linen); }
.veil-card .k { font-family: var(--f-sc); letter-spacing: 0.22em; color: var(--lemon); font-size: var(--step--1); }
.veil-card .t { font-family: var(--f-display); font-size: var(--step-4); line-height: 1; letter-spacing: -0.01em; }
.veil-card .t i { color: var(--lemon); font-style: italic; }
.veil-card .b { font-family: var(--f-body); font-style: italic; color: var(--linen-2); font-size: var(--step-1); max-width: 30ch; margin: 6px auto 0; text-wrap: balance; }
.veil-cloth + .veil-card, .veil-cloth ~ .veil-card { color: var(--ink); }
.veil-cloth ~ .veil-card .k { color: var(--wine); }
.veil-cloth ~ .veil-card .t i { color: var(--wine); }
.veil-cloth ~ .veil-card .b { color: var(--ink-2); }

/* shared components */
.lt-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 70px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.lt-eyebrow { font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.18em; color: var(--lemon); text-transform: none; }
.lt-display { font-family: var(--f-display); font-weight: 400; line-height: 1.02; letter-spacing: -0.012em; text-wrap: balance; margin: 0; }
.lt-display i, .lt-display em { font-style: italic; color: var(--lemon); }
.lt-prose { max-width: 62ch; font-size: var(--step-0); line-height: 1.62; color: var(--linen-2); text-wrap: pretty; }
.lt-prose p { margin: 0 0 1em; }
.lt-prose strong { color: var(--linen); font-weight: 600; }
.lt-hand { font-family: var(--f-hand); font-weight: 600; }
.lt-script { font-family: var(--f-script); }
.lt-cite { font-family: var(--f-ui); font-size: var(--step--2); color: var(--linen-3); letter-spacing: 0.02em; }
.lt-card { background: var(--paper) var(--paper-tex); color: var(--ink); border-radius: 2px; box-shadow: 0 2px 0 rgba(255, 255, 255, 0.25) inset, 0 30px 70px rgba(0, 0, 0, 0.55), 0 6px 14px rgba(0, 0, 0, 0.4); }

.lt-btn { -webkit-appearance: none; appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.6em; cursor: pointer; font-family: var(--f-sc); font-size: var(--step-0); letter-spacing: 0.08em; color: var(--lemon); background: rgba(242, 193, 78, 0.07); border: 1px solid rgba(242, 193, 78, 0.55); padding: 0.72em 1.4em 0.78em; border-radius: 2px; transition: background 0.25s, box-shadow 0.25s, transform 0.25s var(--ease-out), color 0.25s; text-decoration: none; line-height: 1.1; }
.lt-btn:hover { background: rgba(242, 193, 78, 0.16); box-shadow: 0 0 34px rgba(242, 193, 78, 0.22); transform: translateY(-1px); }
.lt-btn:active { transform: translateY(1px) scale(0.99); }
.lt-btn--ghost { color: var(--linen-2); border-color: rgba(239, 230, 210, 0.25); background: transparent; }
.lt-btn--ghost:hover { color: var(--linen); background: rgba(239, 230, 210, 0.06); box-shadow: none; }
.lt-btn--ink { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.lt-btn--ink:hover { background: var(--wine); border-color: var(--wine); box-shadow: 0 8px 24px rgba(111, 21, 38, 0.3); }
.lt-btn[disabled] { opacity: 0.4; pointer-events: none; }

.lt-next { -webkit-appearance: none; appearance: none; cursor: pointer; display: inline-grid; grid-template-columns: auto auto; align-items: center; column-gap: 18px; text-align: left; background: transparent; border: 0; border-top: 1px solid rgba(242, 193, 78, 0.45); border-bottom: 1px solid rgba(242, 193, 78, 0.45); padding: 14px 6px 16px; color: var(--linen); transition: color 0.3s, letter-spacing 0.4s var(--ease-out); }
.lt-next .k { grid-column: 1; font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.2em; color: var(--lemon); }
.lt-next .t { grid-column: 1; font-family: var(--f-display); font-size: var(--step-2); line-height: 1.05; }
.lt-next .t i { color: var(--lemon); }
.lt-next .a { grid-column: 2; grid-row: 1 / span 2; font-family: var(--f-display); font-size: var(--step-3); color: var(--lemon); transition: transform 0.4s var(--ease-out); }
.lt-next:hover .a { transform: translateX(8px); }
.lt-next:hover .t { color: var(--lemon); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- prelude ---------- */
.prelude { display: grid; place-items: center; }
.prelude .stage { position: relative; width: min(100%, 760px); height: 100%; display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: end; padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 22px); box-sizing: border-box; }
.prelude canvas.candle { width: min(180px, 34vw); height: min(46vh, 420px); display: block; grid-row: 1; align-self: end; }
.prelude .title { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 7vh); text-align: center; padding: 0 var(--gutter); pointer-events: none; }
.prelude .title h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-5); line-height: 0.92; margin: 0; letter-spacing: -0.02em; color: var(--linen); text-shadow: 0 0 40px rgba(255, 170, 80, 0.35); }
.prelude .title h1 .l { display: inline-block; opacity: 0; filter: blur(10px); transform: translateY(14px); transition: opacity 1.3s var(--ease-out), filter 1.6s var(--ease-out), transform 1.6s var(--ease-out); }
.prelude .title h1 .l.on { opacity: 1; filter: blur(0); transform: none; }
.prelude .title h1 .the { display: block; font-style: italic; font-size: 0.36em; color: var(--lemon); letter-spacing: 0; margin-bottom: 0.08em; }
.prelude .title .sub { margin-top: 1.1rem; font-family: var(--f-display); font-style: italic; font-size: var(--step-1); color: var(--linen-2); opacity: 0; transition: opacity 1.5s 0.4s; }
.prelude .title .date { margin-top: 0.8rem; font-family: var(--f-sc); letter-spacing: 0.16em; color: var(--linen-3); font-size: var(--step--1); opacity: 0; transition: opacity 1.5s 0.9s; min-height: 1.4em; text-wrap: balance; }
.prelude .title.on .sub, .prelude .title.on .date { opacity: 1; }
.prelude .below { grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 18px; min-height: 120px; }
.prelude .hint { font-family: var(--f-display); font-style: italic; color: var(--linen-3); font-size: var(--step-1); text-align: center; transition: opacity 0.6s; }
.prelude .hint small { display: block; font-style: normal; font-family: var(--f-ui); font-size: var(--step--2); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; opacity: 0.7; }
.matchbox { position: relative; cursor: pointer; background: none; border: 0; padding: 0; width: 200px; height: 96px; touch-action: none; }
.matchbox svg { width: 100%; height: 100%; overflow: visible; }
.matchbox:hover .mb-drawer { transform: translateX(10px); }
.mb-drawer { transition: transform 0.4s var(--ease-out); }
.match { position: fixed; z-index: 40; width: 74px; height: 12px; pointer-events: none; transform-origin: 8px 50%; }
.prelude .enter { opacity: 0; transform: translateY(10px); transition: opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out); pointer-events: none; }
.prelude .enter.on { opacity: 1; transform: none; pointer-events: auto; }
.prelude .skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-family: var(--f-ui); font-size: var(--step--2); color: var(--linen-3); background: none; border: 0; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
.prelude .skip:hover { opacity: 1; color: var(--linen); }

/* ---------- bill of fare ---------- */
.menu-page { display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 74px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 48px); box-sizing: border-box; min-height: 100%; }
.bill { position: relative; width: min(100%, 560px); padding: clamp(28px, 6vw, 56px) clamp(20px, 6vw, 58px) clamp(30px, 5vw, 48px); box-sizing: border-box; text-align: center; transform-origin: 50% 0; animation: bill-in 1.4s var(--ease-out) both; }
@keyframes bill-in { from { opacity: 0; transform: translateY(30px) rotate(-1.5deg); } to { opacity: 1; transform: rotate(-0.4deg); } }
.bill::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(36, 23, 14, 0.35); pointer-events: none; }
.bill::after { content: ""; position: absolute; inset: 14px; border: 3px double rgba(36, 23, 14, 0.25); pointer-events: none; }
.bill .fleuron { font-family: var(--f-display); font-size: 30px; color: var(--wine); line-height: 1; }
.bill .house { font-family: var(--f-sc); letter-spacing: 0.3em; font-size: var(--step--1); color: var(--ink-2); margin-top: 8px; }
.bill h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); margin: 4px 0 0; line-height: 1; color: var(--ink); }
.bill h2 i { color: var(--wine); }
.bill .when { font-family: var(--f-display); font-style: italic; color: var(--ink-2); margin-top: 8px; font-size: var(--step-0); }
.bill .rule { display: flex; align-items: center; gap: 12px; margin: 22px auto 10px; color: var(--wine); width: 80%; }
.bill .rule::before, .bill .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: 0.5; }
.bill ol { list-style: none; margin: 0; padding: 0; }
.bill li { margin: 0; }
.course-btn { position: relative; display: block; width: 100%; background: none; border: 0; padding: 12px 8px 14px; cursor: pointer; color: var(--ink); text-align: center; border-radius: 2px; transition: background 0.3s; }
.course-btn .k { font-family: var(--f-sc); font-size: var(--step--2); letter-spacing: 0.26em; color: var(--ink-2); display: block; }
.course-btn .t { font-family: var(--f-display); font-size: var(--step-2); line-height: 1.1; display: block; margin-top: 2px; }
.course-btn .t i { color: var(--wine); font-style: italic; margin-right: 0.25em; }
.course-btn .b { font-family: var(--f-body); font-style: italic; font-size: var(--step--1); color: var(--ink-2); display: block; max-width: 36ch; margin: 3px auto 0; text-wrap: balance; }
.course-btn::before { content: "☞"; position: absolute; left: -6px; top: 50%; transform: translate(-14px, -50%); opacity: 0; font-size: 26px; color: var(--wine); transition: opacity 0.3s, transform 0.4s var(--ease-out); }
.course-btn:hover, .course-btn:focus-visible { background: rgba(111, 21, 38, 0.06); }
.course-btn:hover::before, .course-btn:focus-visible::before { opacity: 1; transform: translate(0, -50%); }
.course-btn .eaten { position: absolute; right: 2px; top: 10px; font-family: var(--f-hand); font-size: 20px; color: var(--cran); transform: rotate(-8deg); }
.bill .foot { font-family: var(--f-display); font-style: italic; color: var(--ink-2); font-size: var(--step--1); margin-top: 18px; line-height: 1.5; text-wrap: balance; }
.bill .begin { margin-top: 20px; }
.bill .secrets { margin-top: 18px; font-family: var(--f-ui); font-size: var(--step--2); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.menu-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(10, 8, 5, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; animation: fade-in 0.4s both; }
.menu-overlay .close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.2s !important; }
  #grain { animation: none; }
}
@keyframes match-flicker { from { transform: scale(1, 1) translateY(0); opacity: .95; } to { transform: scale(.92, 1.08) translateY(-1px); opacity: 1; } }

/* the veil when the camera is doing the work */
#veil.glide { pointer-events: auto; }
#veil.glide .veil-card { background: radial-gradient(ellipse 60% 46% at 50% 50%, rgba(6, 4, 3, 0.72), rgba(6, 4, 3, 0.35) 60%, rgba(6, 4, 3, 0) 80%); }
#veil.glide .veil-card .t, #veil.glide .veil-card .b { text-shadow: 0 2px 24px rgba(0, 0, 0, 0.9); }
.on-world.grace { background: transparent; }

/* the prelude when the world is real: the 3D candle takes the canvas's place */
.prelude.in3d canvas.candle { visibility: hidden; }
.prelude.in3d .title h1 { text-shadow: 0 0 40px rgba(255, 170, 80, 0.35), 0 4px 30px rgba(0, 0, 0, 0.85); }
.prelude.in3d .title .sub, .prelude.in3d .title .date { text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9); }
.prelude.in3d .below { position: relative; }
.prelude.in3d .below::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(720px, 120vw); height: 260px; transform: translate(-50%, -50%); z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(5, 4, 3, 0.85), rgba(5, 4, 3, 0.5) 55%, rgba(5, 4, 3, 0) 80%); }

/* css/record.css */
/* Course I — The Record */
.chapter--record { --rec-top: calc(env(safe-area-inset-top, 0px) + 64px); }

/* intro */
.rec-intro { min-height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; gap: 14px; padding: calc(var(--rec-top) + 40px) var(--gutter) 48px; box-sizing: border-box; }
.rec-title { font-size: var(--step-5); }
.rec-lede { font-family: var(--f-display); font-style: italic; font-size: var(--step-1); color: var(--linen-2); max-width: 34ch; margin: 0 auto; text-wrap: balance; line-height: 1.35; }

/* the postcard */
.rec-pc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: clamp(20px, 3vw, 40px); align-items: start; max-width: 1280px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.rec-pc-card { transform: rotate(-0.8deg); box-shadow: 0 26px 40px rgba(0, 0, 0, 0.6), 0 4px 8px rgba(0, 0, 0, 0.5); }
.rec-pc-frame { position: relative; width: 100%; aspect-ratio: 1200 / 760; border-radius: 6px; overflow: hidden; touch-action: none; cursor: none; background: #f6ecd6; user-select: none; -webkit-user-select: none; }
.rec-pc-layer { position: absolute; inset: 0; }
.rec-pc-svg { display: block; width: 100%; height: 100%; }
.rec-pc-rec { --mx: 50%; --my: 50%; --mr: 0px;
  -webkit-mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my), #000 0, #000 60%, rgba(0, 0, 0, 0) 100%);
  mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my), #000 0, #000 60%, rgba(0, 0, 0, 0) 100%);
  transition: opacity 0.8s var(--ease-out); }
.rec-pc-rec.full { -webkit-mask-image: none; mask-image: none; }
.rec-pc-rec.hide { opacity: 0; }
.rec-lens { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 50%; pointer-events: none; box-sizing: border-box;
  border: 2px solid rgba(242, 193, 78, 0.85);
  box-shadow: 0 0 0 1px rgba(20, 12, 4, 0.35), 0 0 40px rgba(255, 170, 80, 0.45), inset 0 0 22px rgba(255, 170, 80, 0.16);
  transition: opacity 0.4s; }
.rec-lens::before { content: ""; position: absolute; left: 50%; top: -18px; width: 12px; height: 20px; margin-left: -6px; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
  background: radial-gradient(ellipse at 50% 75%, #fff4cc 0%, #ffcf6b 35%, #ff8a2a 65%, rgba(255, 120, 40, 0) 78%); animation: match-flicker 0.14s infinite alternate; }
.rec-pc-frame.complete { cursor: default; }
.rec-marks { position: absolute; inset: 0; pointer-events: none; }
.rec-mark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 0; padding: 0; background: transparent; border-radius: 50%; cursor: pointer; pointer-events: auto; display: grid; place-items: center; }
.rec-mark span { opacity: 0; font-family: var(--f-hand); font-weight: 700; font-size: 21px; color: #a3271f; line-height: 1; transform: rotate(-8deg) scale(0.4); transition: transform 0.5s var(--ease-back), opacity 0.3s; }
.rec-mark::before { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff3b8; box-shadow: 0 0 10px 3px rgba(255, 220, 120, 0.8); opacity: 0.75; animation: rec-spark 2.4s ease-in-out infinite; }
.rec-mark:nth-child(2n)::before { animation-delay: -0.8s; }
.rec-mark:nth-child(3n)::before { animation-delay: -1.6s; }
.rec-mark.on::before { opacity: 0; animation: none; }
.rec-mark.on { background: rgba(234, 220, 191, 0.92); box-shadow: 0 0 0 2px #a3271f, 0 3px 8px rgba(0, 0, 0, 0.35); }
.rec-mark.on span { opacity: 1; transform: rotate(-8deg) scale(1); }
.rec-mark:focus-visible { outline: 2px solid var(--lemon); outline-offset: 2px; }
@keyframes rec-spark { 0%, 100% { transform: scale(0.6); opacity: 0.35; } 50% { transform: scale(1.15); opacity: 0.9; } }
.rec-pc-flash { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; background: #eadcbf; color: #a3271f; font-family: var(--f-hand); font-weight: 700; font-size: clamp(17px, 2.2vw, 26px); padding: 4px 14px 6px; border-radius: 2px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.35s, transform 0.5s var(--ease-back); }
.rec-pc-flash.on { opacity: 1; transform: translate(-50%, 0) rotate(-1deg); }

.rec-pc-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rec-pc-count { margin: 0; font-family: var(--f-sc); letter-spacing: 0.12em; color: var(--linen-3); font-size: var(--step--1); }
.rec-pc-count.some { color: var(--lemon); }
.rec-pc-hint { margin: 0; font-family: var(--f-display); font-style: italic; color: var(--linen-2); font-size: var(--step-0); transition: opacity 0.6s; }
.rec-pc-hint.dim { opacity: 0.5; }
.rec-ledger { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rec-note { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 10px; align-items: start; padding: 6px 0 8px; border-bottom: 1px solid rgba(239, 230, 210, 0.08); }
.rec-note .n { font-family: var(--f-hand); font-weight: 700; font-size: 20px; line-height: 1.2; color: var(--linen-3); }
.rec-note .body { display: none; }
.rec-note .locked { font-family: var(--f-display); font-style: italic; color: var(--linen-3); opacity: 0.55; font-size: var(--step--1); line-height: 1.6; }
.rec-note.on .locked { display: none; }
.rec-note.on .body { display: block; animation: rec-ink 0.9s var(--ease-out) both; }
.rec-note.on .n { color: #d4524a; }
.rec-note b { display: block; font-family: var(--f-hand); font-weight: 700; font-size: 23px; line-height: 1.1; color: #e0685e; }
.rec-note p { margin: 2px 0 0; font-size: var(--step--1); line-height: 1.5; color: var(--linen-2); text-wrap: pretty; }
@keyframes rec-ink { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
.rec-pc-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.rec-pc-btns .lt-btn { font-size: var(--step--1); }
.rec-pc-done { padding-top: 6px; opacity: 0; transform: translateY(10px); transition: opacity 1s var(--ease-out), transform 1s var(--ease-out); }
.rec-pc-done.on { opacity: 1; transform: none; }
.rec-pc-done .lt-display { font-size: var(--step-2); margin: 0 0 6px; }
.rec-pc-donesub { margin: 0; color: var(--linen-2); font-style: italic; }
.rec-arrow { font-family: var(--f-display); font-size: var(--step-3); color: var(--lemon); animation: rec-bob 2.2s ease-in-out infinite; line-height: 1; margin-top: 8px; }
@keyframes rec-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

/* bridge */
.rec-bridge { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 60px var(--gutter); box-sizing: border-box; }
.rec-bridge .lt-display { font-size: var(--step-4); max-width: 14ch; }

/* the reel */
.rec-reel { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 0 clamp(18px, 4vw, 64px); max-width: 1320px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.rec-counter { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 20px; min-width: 0; z-index: 2; transition: opacity 0.6s; }
.rec-odo-wrap { display: flex; flex-direction: column; gap: 6px; }
.rec-odo { display: flex; font-family: var(--f-display); font-size: clamp(84px, 12.5vw, 210px); line-height: 1; color: var(--linen); text-shadow: 0 0 50px rgba(255, 170, 80, 0.22); transition: opacity 0.6s; }
.rec-digit { display: inline-block; position: relative; height: 1.12em; width: 0.6em; overflow: hidden; text-align: center;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%); }
.rec-strip { display: flex; flex-direction: column; will-change: transform; }
.rec-strip > span { display: block; height: 1.12em; line-height: 1.12em; }
.rec-odo-label { font-family: var(--f-display); font-style: italic; color: var(--lemon); font-size: var(--step-2); line-height: 1.1; min-height: 1.2em; }
.rec-odo-label.in { animation: rec-label 0.7s var(--ease-out) both; }
@keyframes rec-label { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.rec-counter.blank .rec-odo { opacity: 0; }
.rec-rail { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 2px; max-width: 30em; }
.rec-rail-b { background: none; border: 0; cursor: pointer; font-family: var(--f-sc); font-size: var(--step--2); letter-spacing: 0.08em; color: var(--linen-3); padding: 4px 6px; border-radius: 2px; transition: color 0.3s, background 0.3s; }
.rec-rail-b:hover { color: var(--linen); }
.rec-rail li.on .rec-rail-b { color: var(--ground); background: var(--lemon); }

.rec-stops { min-width: 0; }
.rec-stop { position: relative; min-height: 118vh; }
.rec-inner { position: sticky; top: 11vh; display: flex; flex-direction: column; gap: 18px; padding-bottom: 6vh; }
.rec-art { position: relative; width: 100%; aspect-ratio: 600 / 320; border-radius: 4px; overflow: hidden; background: #1b1611; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }
.rec-art--letter { aspect-ratio: auto; overflow: visible; background: none; box-shadow: none; }
.rec-svg { display: block; width: 100%; height: 100%; }
.rec-split { aspect-ratio: 600 / 220; }
.rec-art:has(.rec-split) { aspect-ratio: 600 / 220; }
.rec-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.rec-copy { max-width: 58ch; }
.rec-when { margin: 0; font-family: var(--f-sc); letter-spacing: 0.18em; color: var(--lemon); font-size: var(--step--1); }
.rec-h { margin: 4px 0 10px; font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); line-height: 1.02; color: var(--linen); text-wrap: balance; }
.rec-copy p:not(.rec-when) { margin: 0 0 0.75em; color: var(--linen-2); line-height: 1.6; text-wrap: pretty; }
.rec-copy strong { color: var(--linen); font-weight: 500; }
.rec-copy q { display: block; font-family: var(--f-display); font-style: italic; font-size: var(--step-1); color: var(--linen); line-height: 1.35; margin-top: 0.4em; quotes: "\201C" "\201D"; }
.rec-copy q + .lt-cite { display: block; margin-top: 6px; }

.rec-shimmer line { animation: rec-shim 3s ease-in-out infinite; opacity: 0.2; }
@keyframes rec-shim { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.75; } }

/* lights */
.rec-lights-num { position: absolute; right: 14px; bottom: 16px; font-family: var(--f-display); font-size: clamp(32px, 5vw, 56px); color: var(--linen-2); line-height: 1; transition: color 1s; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); }
.rec-lights-num.last { color: var(--lemon); }

/* ship */
.rec-ship-day { position: absolute; left: 14px; top: 10px; font-family: var(--f-display); font-size: clamp(18px, 2.4vw, 26px); color: var(--linen); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); font-variant-numeric: tabular-nums; }
.rec-ship-day.land { color: var(--lemon); }
.rec-ship-note { position: absolute; left: 14px; right: 14px; top: 46px; max-width: 30ch; font-family: var(--f-hand); font-weight: 600; font-size: clamp(16px, 2vw, 21px); line-height: 1.2; color: var(--linen); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); opacity: 0; transform: translateY(6px); transition: opacity 0.6s, transform 0.6s var(--ease-out); }
.rec-ship-note.on { opacity: 1; transform: none; }
.rec-ship-ends { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; justify-content: space-between; font-family: var(--f-sc); letter-spacing: 0.1em; font-size: var(--step--2); color: var(--linen-2); text-shadow: 0 1px 6px #000; }

/* letters & broadsides */
.rec-letter { margin: 0; padding: clamp(20px, 3.2vw, 36px) clamp(20px, 3.4vw, 40px); transform: rotate(0.5deg); position: relative; }
.rec-letter::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(36, 23, 14, 0.18); pointer-events: none; }
.rec-letter-head { font-family: var(--f-sc); letter-spacing: 0.18em; font-size: var(--step--2); color: var(--ink-2); margin-bottom: 10px; }
.rec-ink { margin: 0; font-family: var(--f-display); font-style: italic; font-size: clamp(16px, 1.7vw, 21px); line-height: 1.5; color: var(--ink); text-wrap: pretty; }
.rec-ink span { color: rgba(36, 23, 14, 0.13); transition: color 0.5s; }
.rec-ink span.on { color: var(--ink); animation: rec-wet 1.4s ease-out; }
@keyframes rec-wet { from { color: #a3271f; } to { color: var(--ink); } }
.rec-letter figcaption { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; opacity: 0.25; transition: opacity 0.8s; }
.rec-letter.done figcaption { opacity: 1; }
.rec-letter .sig { font-family: var(--f-script); font-size: clamp(14px, 1.5vw, 18px); color: var(--ink); line-height: 1.9; }
.rec-letter .cite { font-family: var(--f-ui); font-size: var(--step--2); color: var(--ink-2); }
.rec-letter--lincoln { transform: rotate(-0.6deg); }

.rec-broadside { padding: clamp(22px, 3.4vw, 40px) clamp(20px, 3vw, 40px); text-align: center; transform: rotate(-0.5deg); position: relative; }
.rec-broadside::before { content: ""; position: absolute; inset: 9px; border: 3px double rgba(36, 23, 14, 0.35); pointer-events: none; }
.rec-broadside .bs-k { font-family: var(--f-sc); letter-spacing: 0.16em; font-size: var(--step--1); color: var(--ink-2); }
.rec-broadside .bs-t { font-family: var(--f-display); font-size: var(--step-3); line-height: 1.05; color: var(--ink); margin: 8px 0 12px; }
.rec-broadside .bs-t i { color: var(--wine); }
.rec-broadside .bs-for { font-family: var(--f-display); font-style: italic; font-size: var(--step-2); color: var(--ink); min-height: 1.3em; }
.bs-reason { display: inline-block; }
.bs-reason.in { animation: rec-label 0.6s var(--ease-out) both; }
.bs-reason.war { color: #a3271f; }
.rec-broadside .bs-small { margin-top: 16px; font-family: var(--f-ui); font-size: var(--step--2); color: var(--ink-2); opacity: 0.8; }
.rec-broadside--wash .bs-body { font-family: var(--f-display); font-size: clamp(16px, 1.7vw, 21px); line-height: 1.5; color: var(--ink); text-align: left; margin: 0; }
.rec-broadside--wash mark { color: var(--ink); background: linear-gradient(to right, rgba(242, 193, 78, 0.75), rgba(242, 193, 78, 0.75)) no-repeat 0 85% / 0% 100%; padding: 0 2px; }
.rec-broadside .bs-sig { margin-top: 14px; font-family: var(--f-script); font-size: clamp(13px, 1.4vw, 16px); color: var(--ink-2); text-align: right; line-height: 1.9; }
.rec-match { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.rec-match .a { display: inline-flex; flex-direction: column; align-items: center; background: var(--paper); color: var(--ink); padding: 6px 12px 8px; border-radius: 2px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
.rec-match .a b { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; }
.rec-match .a small { font-family: var(--f-sc); letter-spacing: 0.1em; font-size: 11px; color: var(--ink-2); }
.rec-match .a.now { background: var(--lemon); }
.rec-match .eq { font-family: var(--f-display); font-size: 30px; color: var(--lemon); }
.rec-match .cap { font-family: var(--f-display); font-style: italic; color: var(--linen); font-size: var(--step-1); flex-basis: 100%; }

/* hale */
.rh-frames g.yes rect:first-child { stroke: var(--lemon); filter: drop-shadow(0 0 8px rgba(242, 193, 78, 0.7)); }
.rh-lamb { cursor: pointer; outline: none; transform-box: fill-box; transform-origin: 50% 100%; }
.rh-lamb:focus-visible circle { stroke: var(--lemon); stroke-width: 2; }
.rh-lamb.bounce { animation: rec-lamb 0.5s var(--ease-back) 3; }
@keyframes rec-lamb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* balloons */
.rec-balloons .rb { cursor: pointer; outline: none; }
.rec-balloons .rb:focus-visible .rb-float { filter: drop-shadow(0 0 6px rgba(242, 193, 78, 0.9)); }
.rb-rise { transition: transform 5.5s cubic-bezier(0.4, 0, 0.8, 0.6), opacity 5.5s; }
.rb.free .rb-rise { transform: translate(var(--dx, 0px), -460px) rotate(var(--rot, 0deg)); opacity: 0; }
.rb-float { animation: rec-float 3.4s ease-in-out infinite; }
@keyframes rec-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

/* 1939 */
.rec-cals { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 12px 0 4px; }
.rec-cal-row { display: flex; align-items: center; gap: clamp(10px, 3vw, 26px); }
.rec-cal-row .vs { font-family: var(--f-display); font-style: italic; font-size: var(--step-2); color: var(--linen-3); }
.rec-cal { display: flex; flex-direction: column; align-items: center; width: clamp(118px, 18vw, 170px); background: var(--paper) var(--paper-tex); color: var(--ink); border: 0; border-radius: 3px; padding: 0 0 12px; cursor: pointer; box-shadow: 0 16px 34px rgba(0, 0, 0, 0.5); overflow: hidden; transform-origin: 50% 0; }

/* II. The Spread */
.sp-wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
  padding: calc(env(safe-area-inset-top, 0px) + 66px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(16px, env(safe-area-inset-left, 0px));

.sp-dish:hover .sp-dish-art, .sp-dish:focus-visible .sp-dish-art { transform: translateY(-6px) scale(1.045); filter: drop-shadow(0 0 18px rgba(255, 190, 100, 0.6)) brightness(1.12); }

/* an open dish */
.sp-scene { position: fixed; inset: 0; z-index: 5; background: var(--ground); display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); }

.sp-controls { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px; pointer-events: none; }
.sp-controls > * { pointer-events: auto; }
.sp-ctl { font-size: var(--step--1); padding: 0.55em 1em 0.6em; background: rgba(21, 17, 12, 0.78); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sp-seg { display: inline-flex; border: 1px solid rgba(242, 193, 78, 0.55); border-radius: 2px; overflow: hidden; background: rgba(21, 17, 12, 0.8); }

.sp-story { min-width: 0; overflow-y: auto; box-sizing: border-box; padding: calc(env(safe-area-inset-top, 0px) + 76px) max(22px, env(safe-area-inset-right, 0px)) 36px 28px; border-left: 1px solid rgba(239, 230, 210, 0.08); background: linear-gradient(to right, #17120c, var(--ground)); }

  .sp-story { overflow: visible; border-left: 0; border-top: 1px solid rgba(239, 230, 210, 0.1); padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) max(16px, env(safe-area-inset-left, 0px)); }

/* fryer advice */

.sp-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.sp-item { cursor: pointer; outline: none; }

.sp-lid--top { top: 0; transform: translateY(-100%); border-radius: 0 0 50% 50% / 0 0 42% 42%; background: linear-gradient(#060403 72%, #1e0905); box-shadow: 0 18px 50px 8px rgba(40, 10, 4, 0.75); }
.sp-lid--bot { bottom: 0; transform: translateY(100%); border-radius: 50% 50% 0 0 / 42% 42% 0 0; background: linear-gradient(#1e0905, #060403 28%); box-shadow: 0 -18px 50px 8px rgba(40, 10, 4, 0.75); }

@media (prefers-reduced-motion: reduce) {

/* css/table.css */
/* III. The Table — survive dinner. */
.tb [hidden] { display: none !important; }
.tb { background: #6e4c30; user-select: none; -webkit-user-select: none; }
.tb-scene { position: absolute; inset: 0; background: #7c5836; overflow: hidden; }

/* scene animation bits */
.tb-flame { transform-box: fill-box; transform-origin: 50% 72%; animation: tb-flick 0.13s infinite alternate; }
@keyframes tb-flick { from { transform: scale(1, 1) skewX(-2deg); opacity: 0.92; } to { transform: scale(0.94, 1.07) skewX(2deg); opacity: 1; } }
