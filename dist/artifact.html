.tb-fryer-fire { transform-box: fill-box; transform-origin: 50% 100%; }
.tb-fryer-fire.boom { animation: tb-fire 1.8s var(--ease-out) forwards; }
@keyframes tb-fire { 0% { opacity: 1; transform: scale(0.3); } 15% { opacity: 1; transform: scale(2.4, 2.8); fill: #fff0a0; } 60% { opacity: 0.8; transform: scale(1.4); } 100% { opacity: 0; transform: scale(1); } }
.tb-led.on { fill: #ff2a1a; animation: tb-blink 0.5s steps(2) infinite; }
@keyframes tb-blink { 50% { fill: #5a1a12; } }
.tb-phone-screen.blare { animation: tb-blare 0.3s steps(3) infinite; }
@keyframes tb-blare { 0% { fill: #ff5ad0; } 33% { fill: #5affd0; } 66% { fill: #ffe45a; } }
.tb-phone-glow.blare { opacity: 0.55; animation: tb-blareglow 0.3s steps(3) infinite; }
@keyframes tb-blareglow { 0% { fill: #ff5ad0; } 33% { fill: #5affd0; } 66% { fill: #ffe45a; } }

/* overlay layer (bubbles, targets) */
.tb-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.tb-layer > * { pointer-events: auto; }
.tb-layer.frozen *, .tb-layer.frozen { animation-play-state: paused !important; }
.tb-layer.frozen .tb-bubble { filter: sepia(0.5); }

.tb-bubble { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); max-width: min(250px, 62vw); width: max-content; box-sizing: border-box;
  background: #fbf7ee; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 18px; padding: 7px 14px 10px;
  font-family: var(--f-hand); font-weight: 700; font-size: 22px; line-height: 1.04; text-align: left; letter-spacing: 0;
  box-shadow: 0 5px 0 rgba(28, 19, 12, 0.28); cursor: pointer; --tail: 0px; -webkit-appearance: none; appearance: none; }
.tb-bubble .tb-who { display: block; font-family: var(--f-sc); font-weight: 400; font-size: 11px; letter-spacing: 0.16em; color: var(--wine); margin-bottom: 2px; line-height: 1.2; }
.tb-bubble .tb-text { display: block; }
.tb-tail { position: absolute; left: calc(50% + var(--tail)); bottom: -15px; width: 0; height: 0; transform: translateX(-50%); pointer-events: none; }
.tb-tail::before, .tb-tail::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); border-left: 9px solid transparent; border-right: 9px solid transparent; }
.tb-tail::before { top: 0; border-top: 15px solid var(--ink); }
.tb-tail::after { top: -3px; border-left-width: 6px; border-right-width: 6px; border-top: 11px solid #fbf7ee; }
.tb-mine:hover { background: #fffdf6; }
.tb-mine:hover .tb-tail::after { border-top-color: #fffdf6; }
.tb-mine:active { transform: translate(-50%, -100%) scale(0.96); }
.tb-mine.danger { animation: tb-jitter 0.1s infinite; border-color: #b8243d; }
@keyframes tb-jitter { 0% { transform: translate(-50%, -100%) rotate(-1.2deg); } 50% { transform: translate(calc(-50% + 1px), -100%) rotate(1.2deg); } 100% { transform: translate(-50%, calc(-100% - 1px)) rotate(-0.6deg); } }
.tb-fuse { position: absolute; left: -5px; top: -5px; pointer-events: none; overflow: visible; }
.tb-cord { fill: none; stroke: #8a6236; stroke-width: 3.5; stroke-linecap: round; }
.tb-burnt { fill: none; stroke: rgba(28, 19, 12, 0.22); stroke-width: 2; stroke-dasharray: 2 6; }
.tb-spark { fill: #fff6c0; filter: drop-shadow(0 0 3px #ffb347) drop-shadow(0 0 7px #ff6a1a); animation: tb-spark 0.07s infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes tb-spark { from { transform: scale(0.8); } to { transform: scale(1.35); } }
.tb-say { cursor: default; pointer-events: none !important; }
.tb-say.big { font-size: 28px; max-width: min(400px, 84vw); padding: 10px 18px 14px; }
.tb-say.chaos { background: #fff0e0; font-size: 25px; border-color: #b8243d; }
.tb-say.chaos .tb-tail::before { border-top-color: #b8243d; }
.tb-say.chaos .tb-tail::after { border-top-color: #fff0e0; }
.tb-you { background: var(--ink); color: var(--lemon); border-color: var(--lemon); pointer-events: none !important; box-shadow: 0 0 0 4px rgba(242, 193, 78, 0.18), 0 8px 20px rgba(0, 0, 0, 0.4); }
.tb-you .tb-who { color: var(--linen-3); }
.tb-you .tb-tail::before { border-top-color: var(--lemon); }
.tb-you .tb-tail::after { border-top-color: var(--ink); }

.tb-slip { position: absolute; transform: translate(-50%, 0) rotate(-2deg); background: var(--paper) var(--paper-tex); color: var(--ink); padding: 8px 13px 9px; max-width: min(290px, 72vw); width: max-content;
  font-family: var(--f-body); font-size: 15px; line-height: 1.28; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); pointer-events: none !important; animation: tb-slip-in 0.45s var(--ease-back) both; transition: opacity 0.45s, transform 0.45s; }
.tb-slip b { font-family: var(--f-sc); color: var(--cran); letter-spacing: 0.08em; font-weight: 400; }
.tb-slip--miss b { color: #b5651d; }
.tb-slip.out { opacity: 0; transform: translate(-50%, -14px) rotate(-3deg); }
@keyframes tb-slip-in { from { opacity: 0; transform: translate(-50%, 18px) rotate(4deg) scale(0.8); } to { opacity: 1; transform: translate(-50%, 0) rotate(-2deg); } }

.tb-target { z-index: 3; position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); width: 66px; height: 66px; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle, rgba(255, 110, 50, 0.45), rgba(255, 80, 30, 0.12) 70%); cursor: pointer; display: grid; place-items: center; -webkit-appearance: none; appearance: none; }
.tb-target::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid rgba(255, 140, 70, 0.85); animation: tb-pulse 0.85s var(--ease-out) infinite; }
@keyframes tb-pulse { from { transform: scale(0.8); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
.tb-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.tb-ring .bg { fill: rgba(28, 19, 12, 0.35); stroke: rgba(255, 255, 255, 0.3); stroke-width: 5; }
.tb-ring .fg { fill: none; stroke: #ffd25a; stroke-width: 5; stroke-dasharray: 100; stroke-dashoffset: 0; stroke-linecap: round; }
.tb-bang { position: relative; font-family: var(--f-display); font-size: 38px; line-height: 1; color: #fff; text-shadow: 0 2px 0 #b8243d, 0 0 12px rgba(255, 100, 40, 0.9); animation: tb-bang 0.4s infinite alternate; }
@keyframes tb-bang { from { transform: scale(1) rotate(-6deg); } to { transform: scale(1.18) rotate(6deg); } }
.tb-tlabel { position: absolute; top: calc(100% + 9px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: #b8243d; color: #fff6e6; font-family: var(--f-ui); font-weight: 800; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px 4px; border-radius: 3px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.tb-target:hover .tb-tlabel { background: #d8323f; }

.tb-hit { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); background: transparent; border: 0; border-radius: 50%; cursor: pointer; padding: 0; -webkit-appearance: none; appearance: none; }
.tb-hit--joe { border-radius: 14px; cursor: help; }
.tb-hit:hover { background: radial-gradient(circle, rgba(242, 193, 78, 0.12), transparent 70%); }
.tb-joe-note { z-index: 4; position: absolute; transform: translate(-50%, -100%); width: max-content; max-width: min(260px, 70vw); font-family: var(--f-hand); font-weight: 600; font-size: 22px; line-height: 1.1; color: #fff6e0; text-align: center; background: rgba(15, 10, 6, 0.86); padding: 10px 16px 12px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(242, 193, 78, 0.35), 0 10px 30px rgba(0, 0, 0, 0.5); pointer-events: none !important; animation: tb-fade 1s ease both; transition: opacity 0.9s; }
.tb-joe-note.out { opacity: 0; }
@keyframes tb-fade { from { opacity: 0; transform: translate(-50%, -90%); } to { opacity: 1; transform: translate(-50%, -100%); } }
.tb-flyleg { position: fixed; z-index: 45; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4)); }

/* HUD */
.tb-hud { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 60px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.tb-hud > * { pointer-events: auto; }
.tb-hud-l { position: relative; display: flex; gap: 12px; align-items: center; background: rgba(21, 17, 12, 0.8); border: 1px solid rgba(239, 230, 210, 0.16); border-radius: 999px; padding: 5px 18px 5px 5px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
.tb-thermo { display: flex; align-items: center; gap: 8px; }
.tb-dial { width: 62px; height: 62px; flex: none; }
.tb-read b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--linen); font-variant-numeric: tabular-nums; transition: color 0.3s; }
.tb-thermo.hot .tb-read b { color: #ff7a50; }
.tb-read span, .tb-clock span { display: block; font-family: var(--f-ui); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--linen-3); white-space: nowrap; }
.tb-clock { display: flex; flex-direction: column; padding-left: 12px; border-left: 1px solid rgba(239, 230, 210, 0.18); min-width: 96px; }
.tb-clock b { font-family: var(--f-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1; color: var(--linen); }
.tb-clockbar { display: block; height: 3px; background: var(--lemon); transform-origin: 0 50%; transform: scaleX(0); margin-top: 5px; border-radius: 2px; }
.tb-bingowrap { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 60px); right: max(12px, env(safe-area-inset-right, 0px)); background: var(--paper) var(--paper-tex); color: var(--ink); padding: 7px 8px 8px; border-radius: 2px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); width: 200px; transform: rotate(1.5deg); }
.tb-wide .tb-bingowrap { top: auto; right: auto; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: rotate(-2deg); }
.tb-bingo-k { font-family: var(--f-sc); font-size: 11px; letter-spacing: 0.2em; text-align: center; color: var(--wine); margin-bottom: 4px; white-space: nowrap; }
.tb-bingo-k .n { font-family: var(--f-ui); font-weight: 800; letter-spacing: 0.04em; color: var(--ink); margin-left: 4px; }
.tb-bingo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.tb-cell { position: relative; aspect-ratio: 1.3; border: 1px solid rgba(36, 23, 14, 0.35); display: grid; place-items: center; text-align: center; font-family: var(--f-ui); font-size: 9.5px; line-height: 1.08; padding: 2px; color: var(--ink-2); overflow: hidden; }
.tb-cell span { position: relative; z-index: 1; }
.tb-cell.on::after { content: ""; position: absolute; left: 50%; top: 50%; width: 82%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(184, 36, 61, 0.5); }
.tb-cell.on { color: var(--ink); font-weight: 700; }
.tb-cell.free { font-style: italic; }
.tb-skip { position: absolute; left: 0; top: calc(100% + 10px); background: rgba(21, 17, 12, 0.6); border: 1px solid rgba(239, 230, 210, 0.2); color: var(--linen-3); font-family: var(--f-ui); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.tb-skip:hover { color: var(--linen); border-color: var(--linen-3); }

/* overlays */
.tb-overlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: grid; place-items: center; }
.tb-overlay > * { pointer-events: auto; }
.tb-caption { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-style: italic; font-size: var(--step-2); color: var(--linen); text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8); pointer-events: none !important; animation: tb-fade-up 1.2s var(--ease-out) both; transition: opacity 0.3s; padding: 0 16px; }
.tb-caption.out { opacity: 0; }
@keyframes tb-fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.tb-intro { width: min(440px, calc(100vw - 32px)); box-sizing: border-box; padding: 24px 26px 22px; text-align: left; }
.tb-stamp { font-family: var(--f-display); font-size: clamp(2.4rem, 8vw, 3.4rem); line-height: 0.86; color: var(--cran); text-transform: uppercase; border: 4px solid var(--cran); display: inline-block; padding: 10px 16px 6px; transform: rotate(-4deg); margin: 0 0 16px -4px; box-shadow: inset 0 0 0 2px rgba(184, 36, 61, 0.25); }
.tb-stamp i { font-style: italic; text-transform: none; }
.tb-intro ul { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 10px; font-size: var(--step-0); line-height: 1.4; color: var(--ink-2); }
.tb-intro li b { font-family: var(--f-sc); font-weight: 400; color: var(--wine); letter-spacing: 0.04em; }
.tb-intro-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tb-skip2 { color: var(--ink-2); border-color: rgba(36, 23, 14, 0.3); font-size: var(--step--1); }
.tb-skip2:hover { color: var(--ink); background: rgba(36, 23, 14, 0.06); }

.tb-freeze-cap { background: radial-gradient(ellipse at 50% 55%, rgba(20, 12, 6, 0.62), rgba(20, 12, 6, 0) 68%); padding: 50px 70px; display: flex; flex-direction: column; align-items: center; transform: rotate(-4deg); pointer-events: none !important; animation: tb-stamp 0.5s var(--ease-back) both; transition: opacity 0.3s; text-align: center; padding: 0 16px; }
.tb-freeze-cap.out { opacity: 0; }
.tb-freeze-cap .y { font-family: var(--f-display); font-size: var(--step-5); color: #fff6e6; line-height: 0.85; text-shadow: 0 6px 0 var(--cran), 0 14px 40px rgba(0, 0, 0, 0.7); }
.tb-freeze-cap .u { font-family: var(--f-display); font-style: italic; font-size: var(--step-3); color: var(--lemon); text-shadow: 0 3px 0 rgba(28, 19, 12, 0.9), 0 10px 30px rgba(0, 0, 0, 0.7); margin-top: 0.15em; }
@keyframes tb-stamp { from { opacity: 0; transform: rotate(-4deg) scale(2.2); } to { opacity: 1; transform: rotate(-4deg) scale(1); } }

.tb-cert { position: relative; width: min(520px, calc(100vw - 32px)); max-height: calc(100% - 96px); overflow: auto; box-sizing: border-box; padding: 26px 26px 22px; text-align: center; }
.tb-cert::before { content: ""; position: absolute; inset: 9px; border: 3px double rgba(36, 23, 14, 0.3); pointer-events: none; }
.tb-cert .k { font-family: var(--f-sc); letter-spacing: 0.24em; color: var(--wine); font-size: var(--step--1); }
.tb-cert h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); margin: 4px 0 10px; line-height: 1; color: var(--ink); text-wrap: balance; }
.tb-cert h2 i { color: var(--wine); }
.tb-cert p { font-size: var(--step--1); line-height: 1.45; margin: 0 auto 10px; color: var(--ink-2); max-width: 40ch; }
.tb-cert p.big { font-family: var(--f-display); font-style: italic; color: var(--ink); font-size: var(--step-1); line-height: 1.25; }
.tb-cert .sig { margin: 6px 0 12px; }
.tb-cert .sig span { display: block; font-size: 26px; color: var(--ink); line-height: 1.6; }
.tb-cert .sig small { font-family: var(--f-ui); font-size: 12px; color: var(--ink-2); letter-spacing: 0.06em; border-top: 1px solid rgba(36, 23, 14, 0.35); padding-top: 3px; }
.tb-cert .sigrow { display: flex; align-items: center; justify-content: center; gap: 14px; }
.tb-cert .seal { flex: none; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c93a4c, #7d1a2c 60%, #4d0f19); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.15), 0 3px 6px rgba(0, 0, 0, 0.3); color: #f3d6b8; display: grid; place-items: center; font-family: var(--f-display); font-size: 26px; transform: rotate(12deg); }
.tb-minibingo-wrap { margin: 4px auto 16px; width: min(260px, 100%); }
.tb-minibingo-wrap .k { margin-bottom: 4px; }
.tb-minibingo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.tb-minibingo .c { position: relative; aspect-ratio: 1.5; border: 1px solid rgba(36, 23, 14, 0.3); display: grid; place-items: center; font-family: var(--f-ui); font-size: 9.5px; line-height: 1.05; padding: 2px; color: var(--ink-2); }
.tb-minibingo .c span { position: relative; z-index: 1; }
.tb-minibingo .c.on::after { content: ""; position: absolute; left: 50%; top: 50%; height: 84%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(184, 36, 61, 0.45); }

.tb-final { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; width: max-content; max-width: calc(100vw - 32px); padding: 34px 48px 26px; background: radial-gradient(closest-side, rgba(15, 10, 6, 0.9), rgba(15, 10, 6, 0.7) 55%, rgba(15, 10, 6, 0)); }
.tb-final .lt-btn--ghost { font-size: var(--step--1); }

@media (max-width: 640px), (max-height: 520px) {
  .tb-bubble { font-size: 18px; padding: 6px 11px 8px; border-radius: 14px; max-width: min(210px, 60vw); }
  .tb-bubble .tb-who { font-size: 10px; }
  .tb-say.big { font-size: 22px; }
  .tb-hud-l { gap: 8px; padding: 4px 12px 4px 4px; }
  .tb-dial { width: 46px; height: 46px; }
  .tb-read b { font-size: 22px; }
  .tb-read span { display: none; }
  .tb-clock { min-width: 0; padding-left: 8px; }
  .tb-clock b { font-size: 20px; }
  .tb-clock span { font-size: 9px; }
  .tb-bingowrap { width: auto; padding: 5px 11px 6px; border-radius: 999px; transform: none; }
  .tb-wide .tb-bingowrap { transform: none; }
  .tb-bingo-k { font-size: 10px; letter-spacing: 0.12em; margin: 0; }
  .tb-bingo { display: none; }
  .tb-cert { padding: 22px 18px 18px; }
  .tb-cert h2 { font-size: var(--step-2); }
  .tb-cert p.big { font-size: var(--step-0); }
  .tb-minibingo .c { aspect-ratio: 2.3; font-size: 8.5px; }
  .tb-minibingo-wrap { margin-bottom: 12px; }
  .tb-target { width: 58px; height: 58px; }
  .tb-tlabel { font-size: 10.5px; }
  .tb-slip { font-size: 13.5px; }
  .tb-joe-note { font-size: 19px; }
  .tb-skip { left: auto; right: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .tb-mine.danger, .tb-chaos .tb-svg, .tb-bang { animation: none; }
}

/* css/grace.css */
/* Course IV — Grace. One candle again; the room opens up as it goes. */
.grace { background: radial-gradient(ellipse 90% 70% at 50% 68%, #2a2017 0%, var(--ground) 70%); }
.grace [hidden] { display: none !important; }

/* ---------- scene frame ---------- */
.g-scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  padding: calc(env(safe-area-inset-top, 0px) + 74px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 44px) max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--ground-3) transparent;
  opacity: 0; transform: translateY(18px); filter: blur(6px);
  transition: opacity 0.9s var(--ease-out), transform 1s var(--ease-out), filter 0.9s var(--ease-out); }
.g-scene > * { flex-shrink: 0; }
.g-scene > :first-child { margin-top: auto; }
.g-scene > :last-child { margin-bottom: auto; }
.g-scene.in { opacity: 1; transform: none; filter: none; }
.g-scene.out { opacity: 0; transform: translateY(-14px); filter: blur(5px); pointer-events: none; transition-duration: 0.6s; }

.g-rail { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; gap: 7px; align-items: center; }
.g-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--linen-3); opacity: 0.3; transition: opacity 0.4s, background 0.4s, transform 0.4s var(--ease-back); }
.g-dot.on { opacity: 0.8; background: var(--lemon); }
.g-dot.cur { transform: scale(1.7); box-shadow: 0 0 10px rgba(242, 193, 78, 0.7); }

/* ---------- type ---------- */
.g-lede { font-family: var(--f-display); font-size: var(--step-2); line-height: 1.18; color: var(--linen); max-width: 24ch; margin: 0 auto; text-wrap: balance; }
.g-lede i { color: var(--lemon); }
.g-lede--for { font-family: var(--f-script); font-size: var(--step-2); color: var(--lemon); }
.g-body { font-family: var(--f-body); font-size: var(--step-0); line-height: 1.6; color: var(--linen-2); max-width: 56ch; margin: 0 auto; text-wrap: pretty; }
.g-body em, .g-body i { color: var(--linen); }
.g-strong { color: var(--linen); font-weight: 600; }
.g-say { font-family: var(--f-body); font-style: italic; font-size: var(--step-1); line-height: 1.45; color: var(--linen); margin: 0.35em auto; max-width: 38ch; text-wrap: balance; }
.g-dir { font-family: var(--f-ui); font-style: italic; font-size: var(--step--1); color: var(--linen-3); letter-spacing: 0.01em; margin: 0.5em auto; max-width: 46ch; text-wrap: balance; }
.g-who { font-family: var(--f-sc); font-style: normal; font-size: var(--step--1); letter-spacing: 0.12em; color: var(--lemon); white-space: nowrap; }
.g-h2 { font-size: var(--step-3); }
.g-w { display: inline-block; animation: g-word 0.7s var(--ease-out) both; }
@keyframes g-word { from { opacity: 0; transform: translateY(7px); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
.g-rise { animation: g-rise 1.1s var(--ease-out) both; }
@keyframes g-rise { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.g-pop { animation: g-pop 0.8s var(--ease-back) both; }
@keyframes g-pop { from { opacity: 0; transform: translateY(10px) scale(0.94); } to { opacity: 1; transform: none; } }
.g-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; margin-top: 6px; }
.g-skip { background: none; border: 0; padding: 6px 4px; cursor: pointer; font-family: var(--f-ui); font-size: var(--step--2); letter-spacing: 0.12em; text-transform: uppercase; color: var(--linen-3); opacity: 0.75; }
.g-skip:hover { color: var(--linen); opacity: 1; }
.g-hint { font-family: var(--f-ui); font-size: var(--step--2); letter-spacing: 0.16em; text-transform: uppercase; color: var(--linen-3); transition: opacity 0.6s; animation: g-breathe 2.4s ease-in-out infinite; margin: 0; }
@keyframes g-breathe { 50% { opacity: 0.45; } }

/* ---------- table plan ---------- */
.g-map { width: min(400px, 84vw); height: auto; overflow: visible; flex: none; }
.g-map--big { width: min(560px, 92vw); }
.g-map-table { fill: #3a2b1d; stroke: rgba(239, 230, 210, 0.22); stroke-width: 1.5; }
.g-map-runner { stroke: var(--wine); stroke-width: 12; stroke-linecap: round; opacity: 0.55; }
.g-seat-c { fill: var(--ground-3); stroke: var(--linen-3); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; transition: fill 0.6s, stroke 0.6s; }
.g-seat-t { font-family: var(--f-display); font-size: 11px; fill: var(--linen-2); pointer-events: none; }
.g-seat-t--you { font-size: 8.5px; font-family: var(--f-ui); font-weight: 700; letter-spacing: 0.04em; }
.g-seat--joe .g-seat-c { stroke-dasharray: 3 3; fill: transparent; }
.g-seat--you .g-seat-c { stroke: var(--lemon); }
.g-seat-flame { fill: var(--lemon); opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transition: opacity 0.6s; filter: drop-shadow(0 0 4px rgba(255, 190, 90, 0.9)); }
.g-seat.lit .g-seat-flame { opacity: 1; animation: g-flick 0.18s ease-in-out infinite alternate; }
.g-seat.lit .g-seat-c { fill: #5b3e1c; stroke: var(--lemon); }
.g-seat.cur .g-seat-c { stroke: var(--lemon); stroke-width: 2.4; animation: g-seatpulse 1.4s ease-in-out infinite; }
.g-paw { fill: var(--linen-3); opacity: 0.45; transition: fill 0.6s, opacity 0.6s; }
.g-seat--biscuit.lit .g-paw, .g-seat--biscuit.cur .g-paw { fill: var(--lemon); opacity: 1; }
.g-seat--biscuit .g-seat-flame { display: none; }
@keyframes g-flick { from { transform: scale(1, 1); } to { transform: scale(0.88, 1.12); } }
@keyframes g-seatpulse { 50% { transform: scale(1.18); } }

/* ---------- the toast ---------- */
.g-toast .g-map--big { width: min(480px, 92vw); }
.g-toast-candle { width: 150px; height: 150px; display: block; flex: none; margin: -6px 0 -10px; }
.g-toast-text { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 8.5em; }
.g-toast .g-lede { font-size: var(--step-1); max-width: 34ch; line-height: 1.3; }

/* ---------- the round ---------- */
.g-round { gap: 10px; }
.g-round-body { display: grid; grid-template-columns: auto minmax(0, 40ch); align-items: center; gap: clamp(20px, 4vw, 56px); }
.g-round-text { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 8px; min-width: 0; }
.g-round-text .g-speaker { align-items: flex-start; }
.g-round-text .g-lines { align-items: flex-start; min-height: 11em; }
.g-round-text .g-lines p { margin: 0.22em 0; }
.g-round-text .g-controls { align-items: flex-start; }
.g-round .g-map { width: min(340px, 80vw); }
.g-frame { position: relative; width: min(400px, 46vh, 44vw); aspect-ratio: 340 / 330; flex: none; }
.g-portrait { width: 100%; height: 100%; display: block; overflow: visible; }
.g-figwrap { transition: opacity 0.7s ease; }
.g-pcandle { position: absolute; right: -24%; bottom: 3%; width: 60%; height: 50%; pointer-events: none; }
.g-speaker { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.g-name { font-family: var(--f-sc); font-size: var(--step-0); letter-spacing: 0.16em; color: var(--lemon); }
.g-blurb { font-family: var(--f-ui); font-size: var(--step--2); color: var(--linen-3); letter-spacing: 0.02em; max-width: 44ch; }
.g-lines { min-height: 8.4em; max-width: 44ch; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.g-lines p { margin: 0.22em auto; }
.g-controls { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.g-next { background: none; border: 0; border-bottom: 1px solid rgba(242, 193, 78, 0.5); cursor: pointer; padding: 6px 2px 4px; font-family: var(--f-sc); font-size: var(--step-0); letter-spacing: 0.08em; color: var(--lemon); animation: g-pop 0.6s var(--ease-back) both; }
.g-next:hover { border-bottom-color: var(--lemon); text-shadow: 0 0 18px rgba(242, 193, 78, 0.5); }

/* ---------- place cards ---------- */
.g-card { perspective: 700px; }
.g-card-face { position: relative; background: var(--paper) var(--paper-tex); color: var(--ink); padding: 18px 22px 16px; border-radius: 2px; transform: rotateX(7deg) rotate(-1deg);
  box-shadow: 0 -2px 0 rgba(255, 255, 255, 0.35) inset, 0 22px 40px rgba(0, 0, 0, 0.55), 0 4px 8px rgba(0, 0, 0, 0.35); }
.g-card-face::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: linear-gradient(#b9a983, #8d7e5e); transform-origin: top; transform: perspective(80px) rotateX(-40deg); border-radius: 0 0 2px 2px; }
.g-card--chair .g-card-face { min-width: 210px; }
.g-card-input { display: block; width: 100%; box-sizing: border-box; font-family: var(--f-script); font-size: 21px; line-height: 2; color: var(--ink); background: transparent; border: 0; border-bottom: 1px dashed rgba(36, 23, 14, 0.45); text-align: center; padding: 4px 6px 0; outline: none; }
.g-card-input::placeholder { color: rgba(36, 23, 14, 0.35); }
.g-card-input:focus { border-bottom-color: var(--wine); }
.g-card-script { font-family: var(--f-script); font-size: 22px; line-height: 2; color: var(--ink); min-width: 160px; overflow-wrap: anywhere; }
.g-card-script--long { font-size: clamp(15px, 1.3vw + 9px, 20px); text-align: left; white-space: pre-wrap; }
.g-card-k { font-family: var(--f-sc); font-size: var(--step--2); letter-spacing: 0.2em; color: var(--ink-2); text-align: left; }
.g-nudge { animation: g-nudge 0.45s ease; }
@keyframes g-nudge { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* ---------- the empty chair ---------- */
.g-still { width: min(400px, 88vw); height: auto; flex: none; filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.g-chair-text { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 5em; }
.g-chair-row { display: flex; align-items: flex-end; justify-content: center; gap: 18px; }
.g-chair-candle { width: 120px; height: 140px; flex: none; margin: 0 -30px; }

/* ---------- your turn ---------- */
.g-you-head { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.g-you-sub { font-style: italic; color: var(--linen-3); }
.g-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.g-chip { background: rgba(239, 230, 210, 0.04); border: 1px solid rgba(239, 230, 210, 0.22); color: var(--linen-2); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: var(--f-ui); font-size: var(--step--1); transition: border-color 0.2s, color 0.2s, background 0.2s; }
.g-chip:hover { border-color: var(--linen-2); color: var(--linen); }
.g-chip.on { border-color: var(--lemon); color: var(--lemon); background: rgba(242, 193, 78, 0.08); }
.g-card--you .g-card-face { width: min(520px, 86vw); box-sizing: border-box; text-align: left; }
.g-you-form { display: flex; flex-direction: column; gap: 4px; }
.g-label { font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.14em; color: var(--wine); }
.g-lined { width: 100%; box-sizing: border-box; resize: none; border: 0; outline: none; color: var(--ink); background: transparent;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, rgba(111, 21, 38, 0.28) 35px, rgba(111, 21, 38, 0.28) 36px);
  font-family: var(--f-script); font-size: clamp(14px, 1.1vw + 9px, 18px); line-height: 36px; padding: 2px 4px; min-height: 108px; }
.g-lined::placeholder { color: rgba(36, 23, 14, 0.38); }
.g-lined:focus-visible { outline: 2px solid var(--wine); outline-offset: 4px; }
.g-after { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 4em; }

/* ---------- 1 · the word ---------- */
.g-word-intro { color: var(--linen-3); font-style: italic; }
.g-bigword { display: flex; justify-content: center; font-family: var(--f-display); font-size: clamp(4rem, 3rem + 9vw, 11rem); line-height: 1; letter-spacing: 0.02em; color: var(--linen); margin: 4px 0; perspective: 600px; text-shadow: 0 0 40px rgba(255, 170, 80, 0.25); }
.g-letter { display: inline-block; }
.g-letter--i { background: none; border: 0; padding: 0 0.04em; margin: 0; font: inherit; color: inherit; cursor: pointer; line-height: 1; animation: g-glowi 1.8s ease-in-out infinite; border-radius: 4px; }
.g-letter--i:hover { color: var(--lemon); }
.g-letter--i.done { color: var(--lemon); animation: none; cursor: default; text-shadow: 0 0 40px rgba(242, 193, 78, 0.6); }
@keyframes g-glowi { 50% { text-shadow: 0 0 26px rgba(242, 193, 78, 0.85); color: #fff3d0; } }
.g-lf { display: inline-block; transform-origin: 50% 60%; }
.g-lf.flip { animation: g-flip 0.52s var(--ease-in-out); }
@keyframes g-flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.g-word-body { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 9em; }
.g-word-body .g-body { font-size: var(--step-1); }
.g-thorn { background: none; border: 0; padding: 0; font: inherit; color: var(--lemon); cursor: help; border-bottom: 1px dotted rgba(242, 193, 78, 0.6); }
.g-thorn.found { color: var(--cran); border-bottom-style: solid; }

/* ---------- 2 · the hands ---------- */
.g-hands { gap: 10px; }
.g-hands > :first-child { margin-top: 0; }
.g-hands > :last-child { margin-bottom: 0; }
.g-hands-head { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.g-hands-head.small .g-body:not(.g-strong) { display: none; }
.g-hands-head.small .g-strong { display: none; }
.g-items { display: grid; grid-template-columns: repeat(4, minmax(0, 132px)); gap: 12px; justify-content: center; margin: auto 0; }
.g-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 10px 14px; cursor: pointer; background: rgba(239, 230, 210, 0.04); border: 1px solid rgba(239, 230, 210, 0.16); border-radius: 3px; color: var(--linen-2); font-family: var(--f-sc); font-size: var(--step-0); letter-spacing: 0.08em; transition: border-color 0.25s, background 0.25s, transform 0.3s var(--ease-out), box-shadow 0.3s; }
.g-item svg { width: 58px; height: 58px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4)); transition: transform 0.4s var(--ease-back); }
.g-item:hover { border-color: var(--lemon); background: rgba(242, 193, 78, 0.07); color: var(--lemon); transform: translateY(-3px); box-shadow: 0 0 30px rgba(242, 193, 78, 0.15); }
.g-item:hover svg { transform: scale(1.1) rotate(-4deg); }
.g-web { position: relative; width: 100%; flex: 1 1 auto; min-height: 300px; }
.g-web-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.g-web-big { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -40%) scale(0.96); width: min(92%, 760px); pointer-events: none; opacity: 0; transition: opacity 2.2s var(--ease-out), transform 2.4s var(--ease-out);
  font-family: var(--f-display); font-size: var(--step-4); line-height: 1.02; color: var(--linen); text-shadow: 0 0 30px rgba(10, 8, 5, 0.95), 0 0 60px rgba(10, 8, 5, 0.9), 0 2px 2px rgba(0, 0, 0, 0.8); text-wrap: balance; }
.g-web-big i { color: var(--lemon); }
.g-web-big.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.g-web-ctrl { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.g-count { font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.14em; color: var(--lemon); font-variant-numeric: tabular-nums; min-height: 1.4em; }
.g-caption { font-family: var(--f-body); font-style: italic; font-size: var(--step--1); color: var(--linen-2); max-width: 60ch; min-height: 2.8em; margin: 0; text-wrap: balance; }

/* ---------- 3 · both at once ---------- */
.g-both-text { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.g-quote { margin: 6px auto; padding: 4px 0 4px 18px; border-left: 2px solid var(--lemon); max-width: 52ch; text-align: left; }
.g-quote p { font-family: var(--f-display); font-style: italic; font-size: var(--step-0); line-height: 1.4; color: var(--linen); margin: 0 0 6px; }
.g-both { gap: 10px; }
.g-quote cite { font-style: normal; display: block; }
.g-twins { display: flex; justify-content: center; gap: clamp(0px, 3vw, 30px); align-items: flex-end; }
.g-twin { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 6px 8px; cursor: pointer; color: var(--linen-2); border-radius: 4px; }
.g-twin:disabled { cursor: default; }
.g-twin:not(:disabled):not(.lit) .g-twin-l { color: var(--linen); text-shadow: 0 0 20px rgba(242, 193, 78, 0.5); }
.g-twin:not(:disabled):not(.lit) canvas { animation: g-breathe 2s ease-in-out infinite; }
.g-twin-canvas { width: 150px; height: 160px; display: block; }
.g-twin-l { font-family: var(--f-hand); font-size: 23px; line-height: 1.1; max-width: 12ch; color: var(--linen-3); transition: color 0.6s; }
.g-twin.lit .g-twin-l { color: var(--lemon); }
.g-both-status { min-height: 2.4em; }

/* ---------- 4 · the evidence ---------- */
.g-ev-intro { font-style: italic; color: var(--linen-3); }
.g-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
.g-index { width: min(330px, 88vw); box-sizing: border-box; padding: 20px 22px 16px; text-align: left; transform: rotate(var(--rot, 0deg)); }
.g-index--wide { width: min(560px, 92vw); }
.g-index-who { font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.08em; color: var(--wine); padding-bottom: 8px; margin: 0 -22px 4px; padding-left: 22px; padding-right: 22px; border-bottom: 1px solid rgba(184, 36, 61, 0.4); }
.g-index p { font-family: var(--f-body); font-size: var(--step--1); line-height: 1.55; color: var(--ink); margin: 6px 0 10px; }
.g-index-where { font-family: var(--f-ui); font-style: italic; font-size: var(--step--2); color: var(--ink-2); }
.g-deal { animation: g-deal 0.9s var(--ease-out) both; }
@keyframes g-deal { from { opacity: 0; transform: translateY(50px) rotate(-8deg); } to { opacity: 1; transform: rotate(var(--rot, 0deg)); } }
.g-guess { width: min(520px, 92vw); box-sizing: border-box; padding: 20px 24px 22px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.g-guess-q { font-family: var(--f-display); font-size: var(--step-1); line-height: 1.25; margin: 0 0 6px; color: var(--ink); }
.g-range-l { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-ui); font-size: var(--step--1); color: var(--ink-2); }
.g-range-l output { font-family: var(--f-display); font-size: var(--step-1); color: var(--wine); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.g-guess input[type="range"] { width: 100%; accent-color: var(--wine); }

/* ---------- the letter ---------- */
.g-letter { gap: 18px; }
.g-letter-head { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.g-letter-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(20px, 3vw, 40px); width: min(1060px, 100%); text-align: left; align-items: start; }
.g-form { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.g-f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.g-f label, .g-f-l { font-family: var(--f-sc); font-size: var(--step--1); letter-spacing: 0.1em; color: var(--lemon); }
.g-field { width: 100%; box-sizing: border-box; background: rgba(239, 230, 210, 0.06); border: 1px solid rgba(239, 230, 210, 0.22); color: var(--linen); padding: 10px 12px; border-radius: 2px; font-family: var(--f-body); font-size: var(--step-0); line-height: 1.45; resize: vertical; transition: border-color 0.2s, background 0.2s; }
.g-field::placeholder { color: rgba(207, 195, 169, 0.45); }
.g-field:focus { outline: none; border-color: var(--lemon); background: rgba(239, 230, 210, 0.09); }
.g-f .g-chips { justify-content: flex-start; }
.g-letter-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; align-items: stretch; }
.g-letter-right .g-btns { justify-content: flex-start; }
.g-paper { padding: clamp(22px, 3vw, 36px) clamp(20px, 3vw, 36px); transform: rotate(0.6deg); }
.g-letter-text { font-family: var(--f-script); font-size: clamp(13.5px, 0.7vw + 10px, 17px); line-height: 2.05; color: var(--ink); overflow-wrap: anywhere; }
.g-letter-text p { margin: 0 0 0.7em; }
.g-letter-text .ph { color: rgba(36, 23, 14, 0.42); }
.g-letter-text i { font-style: normal; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.g-sign { margin-top: 1.1em !important; }
.g-stamp { animation: g-stamp 0.6s var(--ease-back); }
@keyframes g-stamp { 40% { transform: rotate(0.6deg) scale(1.025); box-shadow: 0 0 0 3px rgba(242, 193, 78, 0.6), 0 30px 70px rgba(0, 0, 0, 0.55); } }
.g-copied { font-family: var(--f-ui); font-size: var(--step--1); color: var(--lemon); margin: 0; min-height: 1.4em; }
.g-send { text-align: left; margin: 0; font-size: var(--step--1); }

/* ---------- hold the light ---------- */
.g-end-candle { width: 170px; height: 170px; display: block; flex: none; }
.g-end-lines { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.g-end-1 { font-family: var(--f-display); font-size: var(--step-2); color: var(--linen-2); margin: 0; }
.g-end-2 { font-family: var(--f-display); font-size: clamp(2.4rem, 1.6rem + 3.6vw, 5rem); line-height: 1.02; color: var(--linen); margin: 0; max-width: 16ch; text-wrap: balance; }
.g-end-2 i { color: var(--lemon); }
.g-end-3 { font-family: var(--f-body); font-style: italic; color: var(--linen-2); max-width: 46ch; margin: 6px 0 0; text-wrap: balance; }
.g-end-3 { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.g-end-3 .lt-script { font-style: normal; color: var(--lemon); font-size: 0.95em; line-height: 1.9; max-width: 40ch; }
.g-end-next { margin-top: 18px; }

/* ---------- phones ---------- */
@media (max-width: 760px) {
  .g-round-body { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 8px; }
  .g-round-text, .g-round-text .g-speaker, .g-round-text .g-lines, .g-round-text .g-controls { align-items: center; text-align: center; }
  .g-round-text .g-lines p { margin: 0.22em auto; }
  .g-round-text .g-lines { min-height: 9em; }
}
@media (max-width: 820px) {
  .g-letter-grid { grid-template-columns: minmax(0, 1fr); }
  .g-letter-right .g-btns { justify-content: center; }
}
@media (max-width: 560px) {
  .g-scene { gap: 10px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .g-items { grid-template-columns: repeat(2, minmax(0, 150px)); }
  .g-lines { min-height: 9.5em; }
  .g-say { font-size: var(--step-0); }
  .g-frame { width: min(240px, 60vw, 30vh); }
  .g-web { min-height: 340px; }
  .g-twin-canvas { width: 120px; height: 140px; }
  .g-quote { padding-left: 12px; }
  .g-toast-text { min-height: 11em; }
}
@media (max-height: 700px) and (min-width: 561px) {
  .g-frame { width: min(260px, 32vh); }
  .g-still { width: min(320px, 70vw); }
}

/* css/leftovers.css */
/* V. Leftovers */
.chapter--leftovers { background: var(--ground); }
.lo-scene { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; animation: lo-in 1.1s var(--ease-out) both; }
.lo-scene.lo-out { opacity: 0; transition: opacity 0.85s ease; pointer-events: none; }
@keyframes lo-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- the kitchen ---------- */
.lo-kitchen { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: calc(env(safe-area-inset-top, 0px) + 78px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 56px) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse 90% 60% at 50% 30%, #231c14, var(--ground) 70%); min-height: 100%; box-sizing: border-box; }

  let rtScene, down = [], up = [], softD = [], softU, quad, qscene, qcam, M = {};
  const LEVELS = 5;
  function makeRT(w, h, ms) {
    const opts = { type: renderer.capabilities.isWebGL2 ? T.HalfFloatType : T.UnsignedByteType, format: T.RGBAFormat, minFilter: T.LinearFilter, magFilter: T.LinearFilter, depthBuffer: !!ms, stencilBuffer: false };

    return new T.WebGLRenderTarget(w, h, opts);
  }
  function buildPost() {
    qscene = new T.Scene(); qcam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    quad = new T.Mesh(new T.PlaneGeometry(2, 2)); quad.frustumCulled = false; qscene.add(quad);
    const sm = (f, u) => new T.ShaderMaterial({ uniforms: u, vertexShader: Q_V, fragmentShader: f, depthTest: false, depthWrite: false });
    M.down = sm(DOWN_F, { tSrc: { value: null }, uHp: { value: new T.Vector2() }, uThr: { value: 1 } });
    M.up = sm(UP_F, { tSrc: { value: null }, tBase: { value: null }, uHp: { value: new T.Vector2() }, uBase: { value: 1 } });
    M.comp = sm(COMP_F, {
      tScene: { value: null }, tBloom: { value: null }, tSoft: { value: null },
      uBloom: { value: 0.62 }, uExposure: { value: 0.95 }, uTime: { value: 0 }, uSoft: { value: 0 }, uDim: { value: 1 },
      uVig: { value: 0.55 }, uGrain: { value: 0.035 }, uCA: { value: 0.012 }, uFade: { value: 1 }, uRes: { value: new T.Vector2(1, 1) },
    });
  }
  function sizePost(w, h) {
    [rtScene, ...down, ...up, ...softD, softU].forEach((r) => r && r.dispose());
    rtScene = makeRT(w, h, true);
    down = []; up = [];
    let dw = w, dh = h;
    for (let i = 0; i < LEVELS; i++) { dw = Math.max(2, dw >> 1); dh = Math.max(2, dh >> 1); down.push(makeRT(dw, dh)); up.push(makeRT(dw, dh)); }
    softD = [makeRT(w >> 1, h >> 1), makeRT(w >> 2, h >> 2), makeRT(w >> 3, h >> 3)];
    softU = makeRT(w >> 2, h >> 2);
    M.comp.uniforms.uRes.value.set(w, h);
  }
  function pass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(qscene, qcam); }
  function downPass(src, dst, thr) {
    M.down.uniforms.tSrc.value = src.texture;
    M.down.uniforms.uHp.value.set(0.5 / src.width, 0.5 / src.height);
    M.down.uniforms.uThr.value = thr; pass(M.down, dst);
  }
  function upPass(src, base, dst, baseK = 1) {
    M.up.uniforms.tSrc.value = src.texture; M.up.uniforms.tBase.value = base ? base.texture : src.texture;
    M.up.uniforms.uHp.value.set(0.5 / src.width, 0.5 / src.height); M.up.uniforms.uBase.value = base ? baseK : 0;
    pass(M.up, dst);
  }

  function buildPostcard(api) {
    const sec = el('section', { class: 'rec-pc', 'aria-label': 'The postcard and the record' });
    const frame = el('div', { class: 'rec-pc-frame' });
    const myth = el('div', { class: 'rec-pc-layer rec-pc-myth', html: mythSVG() });
    const rec = el('div', { class: 'rec-pc-layer rec-pc-rec', html: recordSVG() });
    const lens = el('div', { class: 'rec-lens', 'aria-hidden': 'true' });
    const marks = el('div', { class: 'rec-marks' });
    const flash = el('div', { class: 'rec-pc-flash', 'aria-hidden': 'true' });
    frame.append(myth, rec, lens, marks, flash);
    const card = el('div', { class: 'rec-pc-card' }, frame);

    const count = el('p', { class: 'rec-pc-count', 'aria-live': 'polite' });
    const hint = el('p', { class: 'rec-pc-hint' }, U.isTouch ? 'Drag a finger across the card. Or tap the gold sparks.' : 'Move your candle across the card. The record is underneath.');
    const revealAll = el('button', { class: 'lt-btn lt-btn--ghost rec-pc-all', type: 'button' }, 'Reveal everything');
    const flip = el('button', { class: 'lt-btn lt-btn--ghost', type: 'button', hidden: true }, 'Show the postcard again');
    const ledger = el('ol', { class: 'rec-ledger' });
    const items = NOTES.map((n, i) => {
      const li = el('li', { class: 'rec-note' }, el('span', { class: 'n', 'aria-hidden': 'true' }, String(i + 1)),
        el('div', { class: 'body' }, el('b', null, n.k), el('p', null, n.t)),
        el('span', { class: 'locked' }, 'still hidden'));
      ledger.appendChild(li);
      return li;
    });
    const btns = NOTES.map((n, i) => {
      const b = el('button', { class: 'rec-mark', type: 'button', style: { left: (n.x / VB_W) * 100 + '%', top: (n.y / VB_H) * 100 + '%' }, 'aria-label': `Look closer, clue ${i + 1} of ${NOTES.length}` }, el('span', null, String(i + 1)));
      marks.appendChild(b);
      return b;
    });
    const done = el('div', { class: 'rec-pc-done', hidden: true },
      el('p', { class: 'lt-display' }, 'All eight. ', el('i', null, 'You now know more than the postcard.')),
      el('p', { class: 'rec-pc-donesub' }, 'The record goes on. Keep scrolling.'),
      el('div', { class: 'rec-arrow', 'aria-hidden': 'true' }, '↓'));
    const side = el('div', { class: 'rec-pc-side' }, count, hint, ledger, el('div', { class: 'rec-pc-btns' }, revealAll, flip), done);
    sec.append(card, side);

    const st = { x: 0, y: 0, r: 0, tr: 0, R: 80, W: 1, H: 1, auto: true, found: new Set(), t: 0, complete: false, down: false, visible: true, flashT: 0 };
    function measure() {
      const r = frame.getBoundingClientRect();
      st.W = r.width || 1; st.H = r.height || 1;
      st.R = U.clamp(st.W * 0.11, 56, 132);
      if (!st.x) { st.x = st.W * 0.5; st.y = st.H * 0.55; }
    }
    measure();
    if (typeof ResizeObserver !== 'undefined') { const ro = new ResizeObserver(measure); ro.observe(frame); api.cleanup(() => ro.disconnect()); }
    if (typeof IntersectionObserver !== 'undefined') {
      const io = new IntersectionObserver((es) => es.forEach((e) => (st.visible = e.isIntersecting)), { root: api.root });
      io.observe(frame); api.cleanup(() => io.disconnect());
    }
    function updateCount() {
      count.textContent = `${st.found.size} of ${NOTES.length} myths corrected`;
      count.classList.toggle('some', st.found.size > 0);
    }
    updateCount();

    function showFlash(i) {
      flash.textContent = `${i + 1}. ${NOTES[i].k}`;
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
      st.flashT = 2.6;
    }
    function reveal(i) {
      if (st.found.has(i)) return;
      st.found.add(i);
      items[i].classList.add('on');
      btns[i].classList.add('on');
      btns[i].setAttribute('aria-label', `Clue ${i + 1}: ${NOTES[i].k}`);
      LT.stats.inc('mythsCorrected');
      snd.note([62, 65, 67, 69, 72, 74, 77, 81][st.found.size - 1] || 74, 0.09);
      A.sfx('paper', { dur: 0.25, g: 0.6 });
      showFlash(i);
      updateCount();
      hint.classList.add('dim');
      if (st.found.size === NOTES.length) complete();
    }
    function aimAt(i) {
      st.auto = false;
      st.x = (NOTES[i].x / VB_W) * st.W; st.y = (NOTES[i].y / VB_H) * st.H; st.tr = st.R;
    }
    btns.forEach((b, i) => api.on(b, 'click', (e) => { e.stopPropagation(); aimAt(i); reveal(i); }));
    async function complete() {
      st.complete = true;
      revealAll.hidden = true;
      await api.wait(650);
      A.sfx('chime', { n: 74 });
      LT.music.param('cello', 1);
      frame.classList.add('complete');
      const from = st.r;
      U.tween({ from, to: Math.hypot(st.W, st.H) * 1.1, dur: 1.8, ease: 'inOutCubic', onUpdate: (v) => { st.r = v; st.tr = v; } }).done.then(() => {
        if (!api.alive) return;
        rec.classList.add('full');
        flip.hidden = false;
        done.hidden = false;
        requestAnimationFrame(() => done.classList.add('on'));
      });
      LT.fx.leaves(1.2);
      api.timeout(() => LT.fx.leaves(0), 4000);
    }
    api.on(revealAll, 'click', async () => {
      revealAll.disabled = true;
      for (let i = 0; i < NOTES.length; i++) {
        if (st.found.has(i)) continue;
        aimAt(i);
        await api.wait(U.reducedMotion ? 80 : 480);
        reveal(i);
      }
    });
    api.on(flip, 'click', () => {
      const showingMyth = rec.classList.toggle('hide');
      flip.textContent = showingMyth ? 'Show the record' : 'Show the postcard again';
      A.sfx('paper', { dur: 0.3 });
    });

    const local = (e) => { const r = frame.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    api.on(frame, 'pointermove', (e) => {
      if (st.complete) return;
      if (e.pointerType !== 'mouse' && !st.down) return;
      [st.x, st.y] = local(e); st.auto = false; st.tr = st.R;
    });
    api.on(frame, 'pointerdown', (e) => {
      if (st.complete) return;
      st.down = true; [st.x, st.y] = local(e); st.auto = false; st.tr = st.R;
      if (e.pointerType !== 'mouse') { try { frame.setPointerCapture(e.pointerId); } catch (_) {} }
    });
    api.on(frame, 'pointerup', () => { st.down = false; });
    api.on(frame, 'pointercancel', () => { st.down = false; });
    api.on(frame, 'pointerleave', (e) => { if (e.pointerType === 'mouse' && !st.complete) st.tr = 0; });

    api.frame((dt) => {
      if (!st.visible) return;
      st.t += dt;
      if (st.auto && !st.complete) {
        const a = st.t * 0.42;
        st.x = st.W * (0.5 + 0.36 * Math.sin(a));
        st.y = st.H * (0.52 + 0.26 * Math.sin(a * 1.63 + 1));
        st.tr = st.R * 0.85;
      }
      if (!st.complete) st.r += (st.tr - st.r) * Math.min(1, dt * 9);
      const fl = U.reducedMotion ? 0 : U.noise(st.t * 7) * 0.03;
      const r = st.r * (1 + fl);
      rec.style.setProperty('--mx', st.x.toFixed(1) + 'px');
      rec.style.setProperty('--my', st.y.toFixed(1) + 'px');
      rec.style.setProperty('--mr', Math.max(0, r).toFixed(1) + 'px');
      lens.style.transform = `translate(${(st.x - r).toFixed(1)}px, ${(st.y - r).toFixed(1)}px)`;
      lens.style.width = lens.style.height = Math.max(0, 2 * r).toFixed(1) + 'px';
      lens.style.opacity = st.complete ? 0 : r > 8 ? 1 : 0;
      if (!st.auto && !st.complete && st.r > st.R * 0.6) {
        for (let i = 0; i < NOTES.length; i++) {
          if (st.found.has(i)) continue;
          const ax = (NOTES[i].x / VB_W) * st.W, ay = (NOTES[i].y / VB_H) * st.H;
          if (Math.hypot(ax - st.x, ay - st.y) < st.r * 0.55) reveal(i);
        }
      }
      if (st.flashT > 0) { st.flashT -= dt; if (st.flashT <= 0) flash.classList.remove('on'); }
    });
    return sec;
  }

  /* ======================================================================
     CRANBERRIES — the bounce test

  TOYS.cranberries = function (host, sc, ui) {
    const VW = 1000, VH = 620, G = 1650;
    const v = vcanvas(host, VW, VH, sc);
    const cx = v.cx;
    const berries = [];
    const BOARD = [130, 292, 425, 425];
    const segs = [
      [...BOARD, 'board'],
      [565, 600, 565, 405, 'wall'], [565, 405, 595, 405, 'wall'], [595, 405, 595, 600, 'wall'],
      [96, 0, 96, 600, 'wall'], [0, 600, 1000, 600, 'floor'], [992, 0, 992, 600, 'wall'],
    ];
    const BOWL = { x: 790, y: 470, rx: 150, ry: 118 };
    const bowlPts = [];
    for (let i = 0; i <= 14; i++) { const a = (i / 14) * Math.PI; bowlPts.push([BOWL.x + Math.cos(a) * BOWL.rx, BOWL.y + Math.sin(a) * BOWL.ry]); }
    for (let i = 0; i < bowlPts.length - 1; i++) segs.push([...bowlPts[i], ...bowlPts[i + 1], 'bowl']);
    let good = 0, soft = 0, sessionBounces = 0;
    const rnd = U.seeded(7);
    const hopperPile = Array.from({ length: 26 }, () => ({ x: 182 + rnd() * 136, y: 40 + rnd() * 46, r: 9 + rnd() * 2 }));

    function spawn() {
      const fresh = Math.random() < 0.78;
      berries.push({ x: R(236, 292), y: 98, vx: R(-10, 10), vy: R(0, 30), r: R(9, 11.5), fresh, e: fresh ? R(0.78, 0.86) : R(0.06, 0.16), bounced: false, counted: false, rot: R(TAU), sq: fresh ? 1 : R(0.78, 0.88), hue: R(-1, 1) });
      if (berries.length > 90) { const i = berries.findIndex((b) => b.counted); berries.splice(i >= 0 ? i : 0, 1); }
    }
    function collide(b, s) {
      const [x1, y1, x2, y2, kind] = s;
      const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
      let t = ((b.x - x1) * dx + (b.y - y1) * dy) / L2; t = clamp(t, 0, 1);
      const px = x1 + t * dx, py = y1 + t * dy;
      let nx = b.x - px, ny = b.y - py; const d = Math.hypot(nx, ny);
      if (d >= b.r || d === 0) return;

      b.x = px + nx * b.r; b.y = py + ny * b.r;
      const vn = b.vx * nx + b.vy * ny;
      if (vn >= 0) return;
      const e = kind === 'board' ? b.e : b.e * 0.3;
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty, f = kind === 'board' ? 0.015 : 0.06;
      b.vx -= vt * f * tx; b.vy -= vt * f * ty;
      const impact = -vn;
      if (kind === 'board' && !b.bounced && impact > 240) {
        b.bounced = true;
        if (b.fresh) {
          sessionBounces++;
          const n = LT.stats.inc('cranberriesBounced');
          A.sfx('bounce', { p: clamp(0.35 + impact / 2600 + R(-0.08, 0.08), 0, 1), g: 0.2, pan: -0.4 });
          if (n >= 50) LT.egg('pegleg', 'Peg-Leg Webb would be proud', 'Fifty fresh cranberries, bounced.');
        } else A.sfx('thud', { g: 0.16 });
      } else if (impact > 180) A.sfx('bounce', { p: b.fresh ? R(0.15, 0.3) : 0.05, g: 0.06, pan: (b.x - 500) / 600 });
    }
    function step(dt) {
      const n = Math.max(3, Math.ceil(dt * 320)), h = dt / n; // small steps: no tunnelling through the board
      for (let k = 0; k < n; k++) {
        for (const b of berries) {
          b.vy += G * h; b.x += b.vx * h; b.y += b.vy * h; b.rot += b.vx * h * 0.05;
          for (const s of segs) collide(b, s);
        }
        for (let i = 0; i < berries.length; i++) for (let j = i + 1; j < berries.length; j++) {
          const a = berries[i], b = berries[j];
          if (a.y < 430 || b.y < 430) continue; // only berries that have landed jostle
          const dx = b.x - a.x, dy = b.y - a.y, rr2 = a.r + b.r;
          if (Math.abs(dx) > rr2 || Math.abs(dy) > rr2) continue;
          const d = Math.hypot(dx, dy);
          if (d >= rr2 || d === 0) continue;
          const nx = dx / d, ny = dy / d, o = (rr2 - d) / 2;
          a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
          const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rv < 0) { const imp = -(1.15) * rv / 2; a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny; }
        }
      }
      for (const b of berries) {
        if (b.counted || b.y < 455) continue;
        if (b.x > 620) { good += b.fresh ? 1 : 0; soft += b.fresh ? 0 : 1; b.counted = true; }
        else if (b.x > 100 && b.x < 560) { soft++; b.counted = true; }
      }
    }
    function drawBerry(b) {
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.rot); cx.scale(1, b.sq);
      const base = b.fresh ? (b.hue > 0 ? '#b3122c' : '#c41a33') : '#5a1a1c';
      cx.fillStyle = radial(cx, 0, 0, b.r, [[0, b.fresh ? '#f06a7c' : '#8a4a3c'], [0.45, base], [1, b.fresh ? '#5c0614' : '#2c0c0a']], -b.r * 0.35, -b.r * 0.4);
      ell(cx, 0, 0, b.r, b.r); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.55)'; ell(cx, -b.r * 0.38, -b.r * 0.42, b.r * 0.22, b.r * 0.14, -0.6); cx.fill();
      cx.fillStyle = 'rgba(30,10,6,.8)'; ell(cx, b.r * 0.55, b.r * 0.1, 1.6, 1.6); cx.fill();
      if (!b.fresh) { cx.fillStyle = 'rgba(0,0,0,.25)'; ell(cx, b.r * 0.1, b.r * 0.3, b.r * 0.5, b.r * 0.25); cx.fill(); }
      cx.restore();
    }
    function wood(x, y, w, h, rot = 0) {
      cx.save(); cx.translate(x, y); cx.rotate(rot);
      cx.fillStyle = linear(cx, 0, -h / 2, 0, h / 2, [[0, '#a8743f'], [0.5, '#7a4e26'], [1, '#4d2f15']]);
      rr(cx, -w / 2, -h / 2, w, h, 4); cx.fill();
      cx.strokeStyle = 'rgba(30,18,8,.6)'; cx.lineWidth = 2; cx.stroke();
      cx.strokeStyle = 'rgba(255,220,170,.12)'; cx.lineWidth = 1.2;
      for (let i = -w / 2 + 14; i < w / 2; i += 37) { cx.beginPath(); cx.moveTo(i, -h / 2 + 3); cx.quadraticCurveTo(i + 9, 0, i + 2, h / 2 - 3); cx.stroke(); }

    function draw() {
      bg(v, '#1e1812', '#0d0a07');
      v.begin(null);
      const e = v.ext();

      cx.fillStyle = 'rgba(255,200,140,.035)'; cx.fillRect(e.x0, 0, e.x1 - e.x0, 600);
      cx.fillStyle = '#120d09'; cx.fillRect(e.x0, 600, e.x1 - e.x0, e.y1 - 600);
      cx.strokeStyle = 'rgba(239,230,210,.12)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(e.x0, 600); cx.lineTo(e.x1, 600); cx.stroke();
      // hopper
      cx.fillStyle = linear(cx, 170, 0, 330, 0, [[0, '#4d2f15'], [0.5, '#8a5a2c'], [1, '#4d2f15']]);
      cx.beginPath(); cx.moveTo(160, 20); cx.lineTo(340, 20); cx.lineTo(300, 96); cx.lineTo(200, 96); cx.closePath(); cx.fill();
      cx.strokeStyle = 'rgba(20,12,6,.8)'; cx.lineWidth = 3; cx.stroke();
      cx.save(); cx.beginPath(); cx.moveTo(166, 24); cx.lineTo(334, 24); cx.lineTo(298, 90); cx.lineTo(202, 90); cx.closePath(); cx.clip();
      hopperPile.forEach((h) => drawBerry({ x: h.x, y: h.y + 6, r: h.r, rot: 0, sq: 1, fresh: true, hue: h.x % 2 - 0.5 }));
      cx.restore();
      cx.fillStyle = '#efe6d2'; cx.font = '600 22px ' + 'Caveat, cursive'; cx.textAlign = 'center';
      cx.fillText('tap to drop', 250, 14);
      // reject crate (back)
      cx.fillStyle = 'rgba(90,60,30,.35)'; cx.fillRect(100, 470, 462, 130);
      // board, barrier
      const ang = Math.atan2(BOARD[3] - BOARD[1], BOARD[2] - BOARD[0]);
      const bl = Math.hypot(BOARD[2] - BOARD[0], BOARD[3] - BOARD[1]);
      wood((BOARD[0] + BOARD[2]) / 2 + Math.sin(ang) * 8, (BOARD[1] + BOARD[3]) / 2 + Math.cos(ang) * 8 + 0, bl + 6, 16, ang);
      cx.save(); cx.translate((BOARD[0] + BOARD[2]) / 2, (BOARD[1] + BOARD[3]) / 2 + 40); cx.rotate(ang);
      cx.fillStyle = 'rgba(239,230,210,.55)'; cx.font = '600 22px Caveat, cursive'; cx.fillText('bounce board', 0, 0); cx.restore();
      cx.strokeStyle = 'rgba(20,12,6,.8)'; cx.lineWidth = 6; cx.beginPath(); cx.moveTo(BOARD[2] - 6, BOARD[3] + 6); cx.lineTo(BOARD[2] - 6, 600); cx.stroke();
      wood(580, 502, 30, 196, 0);
      // bowl back
      cx.fillStyle = 'rgba(210,230,240,.06)'; ell(cx, BOWL.x, BOWL.y, BOWL.rx + 8, 26); cx.fill();
      // berries
      berries.forEach(drawBerry);
      // bowl front: clear glass, so you can see the haul
      cx.save();
      cx.beginPath(); cx.moveTo(BOWL.x - BOWL.rx - 8, BOWL.y); cx.ellipse(BOWL.x, BOWL.y, BOWL.rx + 8, BOWL.ry + 10, 0, Math.PI, 0, true);
      cx.ellipse(BOWL.x, BOWL.y, BOWL.rx + 8, 26, 0, 0, Math.PI, false); cx.closePath();
      cx.fillStyle = linear(cx, BOWL.x - BOWL.rx, 0, BOWL.x + BOWL.rx, 0, [[0, 'rgba(210,230,240,.22)'], [0.3, 'rgba(210,230,240,.05)'], [0.7, 'rgba(210,230,240,.04)'], [1, 'rgba(210,230,240,.2)']]);
      cx.fill(); cx.strokeStyle = 'rgba(225,238,245,.55)'; cx.lineWidth = 3; cx.stroke();
      cx.strokeStyle = 'rgba(255,255,255,.45)'; cx.lineWidth = 6; cx.lineCap = 'round';
      cx.beginPath(); cx.ellipse(BOWL.x, BOWL.y, BOWL.rx - 14, BOWL.ry - 14, 0, Math.PI * 0.62, Math.PI * 0.85); cx.stroke();
      cx.lineWidth = 3; cx.beginPath(); cx.ellipse(BOWL.x, BOWL.y, BOWL.rx - 18, BOWL.ry - 20, 0, Math.PI * 0.12, Math.PI * 0.22); cx.stroke();
      cx.restore();
      cx.fillStyle = 'rgba(225,238,245,.25)'; ell(cx, BOWL.x, BOWL.y + BOWL.ry + 12, 70, 10); cx.fill();
      cx.strokeStyle = 'rgba(225,238,245,.6)'; cx.lineWidth = 2.5; ell(cx, BOWL.x, BOWL.y, BOWL.rx + 8, 26); cx.stroke();
      // crate front lip
      cx.fillStyle = linear(cx, 0, 560, 0, 600, [[0, '#7a4e26'], [1, '#3e2510']]);
      cx.fillRect(100, 566, 462, 34);
      cx.strokeStyle = 'rgba(20,12,6,.8)'; cx.lineWidth = 2; cx.strokeRect(100, 566, 462, 34);
      cx.fillStyle = '#efe6d2'; cx.font = '700 24px Caveat, cursive'; cx.textAlign = 'center';
      cx.fillText('soft ones', 330, 590);

    }
    let pouring = false, pourAcc = 0;
    v.input({
      down() { pouring = true; pourAcc = 0.2; A.init && A.init(); },
      up() { pouring = false; },

      step(dt);

    sc.interval(() => {
      if (good === lastG && soft === lastS) return;
      lastG = good; lastS = soft;
      ui.status(`Into the bowl: ${good} · Left behind: ${soft} · Fresh bounces, all time: ${LT.stats.get('cranberriesBounced')}`);
    }, 200);
    ui.status('Into the bowl: 0 · Left behind: 0');
    ui.hint('Tap to drop a berry. Hold to pour.');
    ui.button('Pour a handful', () => { for (let i = 0; i < 12; i++) sc.timeout(spawn, i * 90); });
    sc.timeout(() => { for (let i = 0; i < 5; i++) sc.timeout(spawn, i * 260); }, 500);

  /* ======================================================================
     THE CAN — jellied, ridged, correct

  TOYS.can = function (host, sc, ui) {

    const v = vcanvas(host, VW, VH, sc);

    const st = { mode: 'closed', canX: PX, canY: 300, canRot: 0, open: 0, lidY: 0, lidRot: 0, lidOn: true, shake: 0, suction: 0, jellyY: -400, jellyTop: 0, wob: 0, wv: 0, sq: 0, sv: 0, pieces: [], discs: [], cuts: 0, stroke: null };
    // jelly geometry (virtual): bottom at PY, top at PY - JH*(1-jellyTop)

    const topY = () => jBottom() - JH * (1 - st.jellyTop);
    function jellyOffset(y) { const k = clamp((jBottom() - y) / JH, 0, 1); return st.wob * Math.pow(k, 1.5); }

    }

      cx.fillRect(-w / 2, -h / 2, w, h);

      cx.fillStyle = linear(cx, -w / 2, 0, w / 2, 0, [[0, '#5a1222'], [0.3, '#a8263c'], [0.5, '#b72d44'], [1, '#4a0d1a']]);
      cx.fillRect(-w / 2, -h / 2 + 30, w, h - 60);
      cx.fillStyle = 'rgba(239,230,210,.95)';
      cx.fillRect(-w / 2, -h / 2 + 64, w, 58);
      cx.fillStyle = '#6f1526'; cx.textAlign = 'center';
      cx.font = '18px "IM Fell English SC", Georgia, serif'; cx.fillText('CRANBERRY', 0, -h / 2 + 88);
      cx.font = 'italic 16px "IM Fell Double Pica", Georgia, serif'; cx.fillText('sauce · jellied', 0, -h / 2 + 110);
      for (let i = 0; i < 5; i++) { cx.fillStyle = '#e04a5c'; ell(cx, -40 + i * 20, -h / 2 + 150 + (i % 2) * 8, 8, 8); cx.fill(); cx.fillStyle = 'rgba(255,255,255,.5)'; ell(cx, -43 + i * 20, -h / 2 + 147 + (i % 2) * 8, 2.5, 2); cx.fill(); }

      } else {

    function draw() {

          const dist = Math.hypot(x1 - x0, y1 - y0), w = clamp(9 - dist / 34, 1.2, 9) * s.w;

  /* ---------- the dishes, their stories ---------- */
  const DISHES = [
    { id: 'turkey', name: 'The Bird', title: 'The Bird', kicker: 'The turkey', hot: true, labelDy: 102,
      land: [700, 430, 1.35], port: [380, 480, 1.15],
      story: [
        'Turkeys were domesticated in what is now Mexico about two thousand years ago. Spanish ships carried them to Europe in the 1500s, and the English, probably mixing them up with guinea fowl that came through Turkish merchants, gave them the wrong name. It stuck.',
        'In 1784, Benjamin Franklin wrote to his daughter that the bald eagle was “a Bird of bad moral Character,” and the turkey “a much more respectable Bird, and withal a true original Native of America.” A little “vain & silly,” he admitted, but “a Bird of Courage.”',
        'He never actually proposed it as the national bird. He was just being Franklin.',
        'Wild turkeys sleep in trees and fly fast in short bursts. Most farmed turkeys can’t fly at all; they’ve been bred too heavy to leave the ground.',
      ], cite: 'Sources: Franklin to Sarah Bache, Jan. 26, 1784 (Founders Online); Smithsonian Magazine.' },
    { id: 'cranberries', name: 'Cranberries', title: 'The Bounce Test', kicker: 'Cranberries', labelDy: 86,
      land: [410, 298, 1.1], port: [585, 250, 1.0],
      story: [
        'A fresh cranberry bounces. Inside it are four small pockets of air, which is also why it floats. Most of the crop is harvested wet: growers flood the bog, shake the berries loose, and corral a floating red lake.',
        'Sorting machines still use bounce boards. Firm berries hop the barrier; soft ones stay behind. The legend: a New Jersey grower named John “Peg-Leg” Webb, who couldn’t carry his berries down from the loft, poured them down the stairs instead, and noticed the best ones bounced all the way to the bottom.',
        'People ate them long before there was sauce. In 1643, Roger Williams wrote down the Narragansett word, sasemineash. On Martha’s Vineyard, the Aquinnah Wampanoag still hold Cranberry Day every fall.',

    { id: 'can', name: 'From the Can', title: 'From the Can', kicker: 'Jellied cranberry sauce', labelDy: 52,
      land: [975, 300, 1.1], port: [175, 730, 1.0],
      story: [
        'Canned cranberry sauce goes back to 1912, when Marcus Urann, a Massachusetts lawyer turned cranberry grower, started canning it so he could sell berries all year. His company became part of what is now Ocean Spray.',
        'The ridges come from the can. They make thin metal stronger. Everyone uses them as a slicing guide anyway, and that is correct.',
        'There are two kinds of families: the ones who spoon it into a crystal dish, and the ones who serve the cylinder. You know which one you are.',
      ], cite: 'Sources: Ocean Spray; Smithsonian Magazine.' },
    { id: 'casserole', name: 'Green Bean Casserole', title: 'Green Bean Casserole', kicker: 'A 1955 invention', hot: true, labelDy: 76,
      land: [290, 545, 1.1], port: [175, 935, 0.95],
      story: [
        'In 1955, Dorcas Reilly, a home economist in the Campbell Soup Company’s test kitchen in Camden, New Jersey, was asked to come up with a recipe for a newspaper feature. She used what most kitchens already had: green beans, cream of mushroom soup, milk, soy sauce, pepper, and fried onions on top.',
        'It became one of the most-made side dishes in America. In 2002, her original recipe card went to the National Inventors Hall of Fame.',
        'Reilly died in 2018, at 92. Tonight a lot of people will make her recipe without knowing her name. Now you do.',
      ], cite: 'Sources: National Inventors Hall of Fame; Campbell Soup Company.' },
    { id: 'yams', name: 'Sweet Potatoes', title: 'Sweet Potatoes, Marshmallowed', kicker: 'An advertisement you can eat', hot: true, labelDy: 68,
      land: [1120, 545, 1.1], port: [585, 935, 0.95],
      story: [
        'Marshmallows on sweet potatoes started as marketing. In 1917, Angelus Marshmallows hired Janet McKenzie Hill, founder of the Boston Cooking-School Magazine, to write a recipe booklet that would get people cooking with marshmallows. Mashed sweet potatoes, topped and baked, was one of the recipes.',
        'Also, they are probably not yams. In the 1930s, Louisiana growers started calling their soft, orange sweet potatoes “yams” to set them apart. True yams are a different plant entirely, grown mostly in West Africa.',
      ], cite: 'Sources: Smithsonian Magazine; Library of Congress.' },
    { id: 'pie', name: 'Pumpkin Pie', title: 'Pumpkin Pie', kicker: 'Dessert, technically', labelDy: 64,
      land: [1190, 300, 1.05], port: [585, 730, 1.0],
      story: [
        'The first cookbook written by an American and published in America, Amelia Simmons’s American Cookery (1796), has two recipes for “Pompkin” pudding baked in a crust. That’s pumpkin pie.',
        'There was no pie in 1621: no butter, no wheat flour to spare, and no proper ovens.',
        'The pumpkin in the can is mostly Dickinson squash, a tan, unglamorous cousin of the jack-o’-lantern. Much of it is grown and canned around Morton, Illinois, which calls itself the Pumpkin Capital of the World. Illinois grows more pumpkins than any other state.',
      ], cite: 'Sources: Amelia Simmons, American Cookery (1796); University of Illinois Extension.' },
    { id: 'mac', name: 'Macaroni & Cheese', title: 'Macaroni and Cheese', kicker: 'The dish, and the man', hot: true, quiet: true, labelDy: 64,
      land: [500, 652, 1.1], port: [175, 1135, 1.0],
      story: [
        'In 1784, Thomas Jefferson took James Hemings, a nineteen-year-old man he enslaved, to Paris to be trained in French cooking. Hemings apprenticed for years and became the chef of Jefferson’s household there.',
        'Back in Virginia, Hemings negotiated his own freedom: he would be freed once he had trained his brother Peter to replace him. He was freed in 1796. He died in 1801, at 36.',
        'Jefferson usually gets the credit for macaroni and cheese in America. He imported pasta and sketched a macaroni machine. But it was Hemings who brought French technique into that kitchen, and his training shaped what it cooked for years after he left.',
        'In 1802, a guest at Jefferson’s White House wrote in his diary about “a pie called macaroni,” which he mistook for a dish of very strong onions and did not care for. History has disagreed with him. Since then, it has become a cornerstone of Black American holiday tables. Whoever makes it in your family is a person of standing.',
      ], cite: 'Sources: Thomas Jefferson Foundation (Monticello); diary of Manasseh Cutler, Feb. 6, 1802.' },
    { id: 'gravy', name: 'Gravy', title: 'Gravy', kicker: 'A law of nature', hot: true, labelDy: 52,
      land: [900, 655, 1.1], port: [585, 1135, 1.0],
      story: [
        'There is never enough gravy. This is not a complaint. It is a law.',
        'Gravy is the drippings of the bird, thickened. Every family has a gravy person, and every gravy person has a secret that turns out to be more butter.',
        'The three gravy situations, ranked: there isn’t enough; someone made it from a packet and will not say; or it’s Grandma’s, which no one can replicate because her recipe says “until it looks right.”',
      ], cite: 'Source: every Thanksgiving ever.' },
    { id: 'plate1621', name: 'The 1621 Plate', title: 'The 1621 Plate', kicker: 'Then and now', labelDy: 70,
      land: [205, 300, 1.05], port: [175, 250, 1.0],
      story: [
        'Only two foods are named in the eyewitness account: fowl, which the governor sent four men to hunt, and the five deer the Wampanoag brought. The rest is informed guesswork from what grew, swam, and could be dug up nearby that fall.',
        'Likely there: venison, ducks and geese (maybe turkey), corn as bread or porridge, eels, mussels, squash. Not there: potatoes, pie, sugar for sauce, and forks.',
      ], cite: 'Sources: Edward Winslow, letter of Dec. 11, 1621, printed in Mourt’s Relation (1622); Plimoth Patuxet Museums.' },
    { id: 'wishbone', name: 'The Wishbone', title: 'The Wishbone', kicker: 'For later', labelDy: 42,

      ], cite: 'Sources: Oxford English Dictionary, “merrythought”; folklore, which does not cite its sources.' },
    { id: 'fryer', name: 'The Fryer (in the driveway)', title: 'The Fryer', kicker: 'In the driveway, too close to the garage', labelDy: 66,

        'The physics: oil for frying sits around 350°F. Water that touches it flashes to steam instantly. A frozen or wet turkey carries a lot of water. The oil foams up, spills over onto the flame, and becomes a fireball.',

  LT.chapter({

      const wrap = el('div', { class: 'sp-wrap' }, head, tableWrap, foot);

      function renderCount() {
        count.textContent = `Tasted ${tasted.size} of ${DISHES.length}`;
        count.classList.toggle('all', tasted.size === DISHES.length);

      /* --- build the table SVG for the current orientation --- */
      let layout = null, svg = null;
      const dishEls = {};
      function build() {

        tableWrap.innerHTML = '';
        const VB = portrait ? [760, 1520] : [1400, 900];
        svg = S('svg', { viewBox: `0 0 ${VB[0]} ${VB[1]}`, class: 'sp-table' + (portrait ? ' is-port' : ''), role: 'group', 'aria-label': 'The Thanksgiving table' });
        svg.appendChild(tableDefs());
        // floor, table, runner

        svg.appendChild(S('rect', { ...{ x: run.x, y: run.y, width: run.w, height: run.h }, fill: 'url(#sp-runner)', opacity: 0.9 }));
        const stripe = (o) => portrait

        api.on(lem, 'click', lemonClick);

        // dishes, back to front

      /* --- opening a dish --- */

      }
      function openDish(id, fromEl) {

        const d = BY[id];

        const controls = el('div', { class: 'sp-controls' });

        const wrapEl = el('div', { class: `sp-scene sp-scene--${id}`, role: 'dialog', 'aria-modal': 'true', 'aria-label': d.title }, stage, story);
        root.appendChild(wrapEl);
        let toyScope = makeScope();
        const ui = {
          hint(t) { hint.textContent = t || ''; hint.hidden = !t; },
          status(t) { status.textContent = t || ''; status.hidden = !t; },
          button(label, fn) { const b = el('button', { class: 'lt-btn sp-ctl', type: 'button', on: { click: fn } }, label); controls.appendChild(b); return b; },
          segmented(opts, fn) {

          S('stop', { offset: '0', 'stop-color': '#efe6d2' }), S('stop', { offset: '1', 'stop-color': '#9d927c' }));
        defs.append(halo, cloth);
        svg.appendChild(defs);
        svg.appendChild(S('ellipse', { cx: 0, cy: -150, rx: 170, ry: 150, fill: 'url(#g-halo)' }));
        const figs = S('g');
        svg.appendChild(figs);
        // the table in front
        svg.appendChild(S('path', { d: 'M-170 -6 H170 V40 H-170Z', fill: 'url(#g-cloth)' }));
        svg.appendChild(S('path', { d: 'M-170 -6 H170', stroke: '#fff6e4', 'stroke-width': 2, opacity: 0.6 }));
        svg.appendChild(S('ellipse', { cx: -10, cy: 10, rx: 64, ry: 12, fill: '#f6efe1', stroke: '#1c130c', 'stroke-width': 2.5 }));
        svg.appendChild(S('ellipse', { cx: -10, cy: 9, rx: 42, ry: 7, fill: 'none', stroke: '#c9b48a', 'stroke-width': 1.5 }));
        svg.appendChild(S('path', { d: 'M-92 -2 v24 M-98 -2 v8 M-86 -2 v8 M-98 6 q6 4 12 0 M72 -2 v24', stroke: '#8e9089', 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none' }));
        let cur = null;
        return {
          el: svg,
          show(item) {
            const wrap = S('g', { class: 'g-figwrap' });
            let fig;
            if (item.dog) {
              fig = LT.family.dogFigure({ scale: 1.15 });
              fig.mood('happy');
              wrap.setAttribute('data-noadvance', '');
              wrap.style.cursor = 'pointer';
              let pets = 0;
              wrap.addEventListener('click', () => {
                pets++;
                fig.wag(2.4); LT.audio.sfx('bark', { n: 1 });
                const r = wrap.getBoundingClientRect();
                LT.fx.float(r.left + r.width / 2, r.top + 20, pets >= 3 ? 'good boy' : '♥', { size: 26, color: '#f2c14e' });
                if (pets === 3) LT.egg('grace-biscuit', 'Under the table', 'Someone slipped Biscuit the turkey skin. Nobody saw. Everybody saw.');
              });
            } else {
              fig = LT.family.figure(item.id, { scale: 1.08, mood: item.mood || 'neutral' });
            }
            const inner = S('g');
            if (item.stand) {
              inner.appendChild(S('path', { d: 'M-58 0 L-60 90 H60 L58 0Z', fill: LT.family.get(item.id).shirt, stroke: '#1c130c', 'stroke-width': 3 }));
              inner.appendChild(S('path', { d: 'M-40 -10 L-46 90 H46 L40 -10Z', fill: '#efe6d2', stroke: '#1c130c', 'stroke-width': 2.5 }));
            }
            inner.appendChild(fig.el);
            const lift = item.id === 'benji' ? -26 : item.stand ? -54 : item.dog ? -6 : 0;
            wrap.setAttribute('transform', `translate(0,${lift})`);
            wrap.appendChild(inner);
            wrap.style.opacity = 0;
            figs.appendChild(wrap);
            requestAnimationFrame(() => { wrap.style.transition = 'opacity .7s ease'; wrap.style.opacity = 1; });
            if (cur) {
              const o = cur;
              o.wrap.style.opacity = 0;
              setTimeout(() => o.fig.destroy(), 800);
            }
            cur = { wrap, fig, lift };
            sc.add(() => fig.destroy());
            return cur;
          },
          sit() {
            if (!cur) return;
            const c = cur;
            U.tween({ from: c.lift, to: 0, dur: RM ? 0.1 : 0.9, ease: 'outBounce', onUpdate: (v) => c.wrap.setAttribute('transform', `translate(0,${v})`) });
            LT.audio.sfx('thud', { g: 0.3 });
          },
        };
      }

      async function sceneRound(sec, sc) {
        sec.classList.add('g-round');
        const map = tableMap(false);
        const frame = el('div', { class: 'g-frame' });
        const pt = portrait(sc);
        const cv = el('canvas', { class: 'g-pcandle', 'aria-hidden': 'true' });
        frame.append(pt.el, cv);
